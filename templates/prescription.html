<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prescription Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:40px 20px;

    overflow-x:hidden;
    overflow-y:auto;

    position:relative;

    background:
    linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.78)
    ),
    url("/static/images/background.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

}

/* =========================================
   ANIMATED BACKGROUND GLOW
========================================= */

body::before{

    content:"";

    position:fixed;

    top:-200px;
    left:-200px;

    width:500px;
    height:500px;

    background:rgba(0,123,255,0.25);

    border-radius:50%;

    filter:blur(100px);

    animation:moveGlow1 8s infinite alternate;

    z-index:0;

}

body::after{

    content:"";

    position:fixed;

    bottom:-200px;
    right:-200px;

    width:500px;
    height:500px;

    background:rgba(128,0,255,0.22);

    border-radius:50%;

    filter:blur(120px);

    animation:moveGlow2 10s infinite alternate;

    z-index:0;

}

@keyframes moveGlow1{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(120px,80px);
    }

}

@keyframes moveGlow2{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-120px,-80px);
    }

}

/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    position:relative;

    width:100%;
    max-width:750px;

    padding:45px;

    border-radius:30px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 0 30px rgba(0,123,255,0.25),
    0 0 60px rgba(128,0,255,0.18),
    0 20px 50px rgba(0,0,0,0.5);

    z-index:2;

    animation:containerFade 1s ease;

}

/* =========================================
   CONTAINER ENTRY
========================================= */

@keyframes containerFade{

    from{
        opacity:0;
        transform:translateY(30px) scale(0.95);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

/* =========================================
   TITLE
========================================= */

.title{

    text-align:center;

    font-size:40px;
    font-weight:700;

    color:white;

    margin-bottom:12px;

    text-shadow:
    0 0 15px rgba(0,198,255,0.6),
    0 0 30px rgba(0,123,255,0.5);

}

.subtitle{

    text-align:center;

    color:#d7d7d7;

    font-size:16px;

    line-height:1.7;

    margin-bottom:35px;

}

/* =========================================
   UPLOAD BOX
========================================= */

.upload-box{

    position:relative;

    border:2px dashed rgba(255,255,255,0.35);

    border-radius:25px;

    padding:60px 25px;

    text-align:center;

    cursor:pointer;

    overflow:hidden;

    transition:0.4s;

    background:rgba(255,255,255,0.05);

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.05);

}

.upload-box:hover{

    transform:translateY(-5px) scale(1.01);

    border-color:#00c6ff;

    background:rgba(255,255,255,0.08);

    box-shadow:
    0 0 25px rgba(0,198,255,0.4),
    0 0 50px rgba(0,123,255,0.2);

}

/* =========================================
   SHIMMER EFFECT
========================================= */

.upload-box::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );

    transition:0.8s;

}

.upload-box:hover::before{

    left:100%;

}

/* =========================================
   ICON
========================================= */

.upload-box i{

    font-size:80px;

    color:#4da6ff;

    margin-bottom:25px;

    animation:floatIcon 3s ease-in-out infinite;

    text-shadow:
    0 0 15px rgba(0,198,255,0.7),
    0 0 40px rgba(0,123,255,0.6);

}

@keyframes floatIcon{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

.upload-box h2{

    color:white;

    font-size:28px;

    margin-bottom:12px;

}

.upload-box p{

    color:#d6d6d6;

    font-size:15px;

    line-height:1.6;

}

/* =========================================
   FILE INPUT
========================================= */

#fileInput{
    display:none;
}

/* =========================================
   FILE NAME
========================================= */

.file-name{

    margin-top:22px;

    text-align:center;

    color:#8dffbf;

    font-weight:500;

    font-size:15px;

    text-shadow:
    0 0 12px rgba(0,255,140,0.5);

}

/* =========================================
   SCAN BUTTON
========================================= */

.scan-btn{

    width:100%;

    margin-top:35px;

    padding:18px;

    border:none;
    border-radius:18px;

    cursor:pointer;

    color:white;

    font-size:18px;
    font-weight:700;

    background:linear-gradient(
        135deg,
        #00c6ff,
        #0072ff,
        #6a11cb
    );

    background-size:300% 300%;

    transition:0.4s;

    animation:buttonGlow 5s ease infinite;

    box-shadow:
    0 0 20px rgba(0,198,255,0.5),
    0 0 45px rgba(106,17,203,0.35);

}

.scan-btn:hover{

    transform:translateY(-4px) scale(1.02);

    box-shadow:
    0 0 30px rgba(0,198,255,0.8),
    0 0 60px rgba(106,17,203,0.6),
    0 0 90px rgba(0,114,255,0.4);

}

.scan-btn:active{

    transform:scale(0.97);

}

@keyframes buttonGlow{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* =========================================
   LOADER
========================================= */

.loader{

    display:none;

    margin-top:25px;

    text-align:center;

    color:white;

    font-size:16px;

    animation:pulse 1.5s infinite;

}

@keyframes pulse{

    0%{
        opacity:0.5;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0.5;
    }

}

/* =========================================
   RESULT BOX
========================================= */

.result-box{

    display:none;

    margin-top:35px;

    padding:28px;

    border-radius:22px;

    background:rgba(255,255,255,0.07);

    border:1px solid rgba(255,255,255,0.1);

    color:white;

    line-height:1.9;

    white-space:pre-wrap;

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.03),
    0 0 25px rgba(0,123,255,0.12);

    animation:fadeResult 0.5s ease;

}

@keyframes fadeResult{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================================
   MOBILE RESPONSIVE
========================================= */

@media(max-width:768px){

    .container{

        padding:30px 22px;

    }

    .title{

        font-size:30px;

    }

    .upload-box{

        padding:45px 20px;

    }

    .upload-box h2{

        font-size:23px;

    }

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="title">
        Prescription Scanner
    </div>

    <div class="subtitle">
        Upload your medical prescription and let AI analyze it professionally.
    </div>

    <label for="fileInput">

        <div class="upload-box">

            <i class="fa-solid fa-paperclip"></i>

            <h2>
                Drag or Upload Prescription
            </h2>

            <p>
                Supported Formats:
                PNG, JPG, JPEG, PDF
            </p>

        </div>

    </label>

    <input
        type="file"
        id="fileInput"
        accept=".png,.jpg,.jpeg,.pdf"
    >

    <div class="file-name" id="fileName">
        No file selected
    </div>

    <button class="scan-btn" onclick="scanPrescription()">
        Check Prescription
    </button>

    <div class="loader" id="loader">
        AI is analyzing prescription...
    </div>

    <div class="result-box" id="resultBox"></div>

</div>

<script>

let uploadedFile = null;

document.getElementById("fileInput").addEventListener("change", function(event){

    uploadedFile = event.target.files[0];

    if(uploadedFile){

        document.getElementById("fileName").innerHTML =
        "Successfully Uploaded: " + uploadedFile.name;

    }

});

async function scanPrescription(){

    if(!uploadedFile){

        alert("Please upload a prescription first");
        return;

    }

    document.getElementById("loader").style.display = "block";

    document.getElementById("resultBox").style.display = "none";

    const reader = new FileReader();

    reader.onload = async function(){

        const base64Data = reader.result;

        const response = await fetch("/prescription_ai",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                file_content:base64Data,
                file_name:uploadedFile.name,
                file_type:uploadedFile.type

            })

        });

        const data = await response.json();

        document.getElementById("loader").style.display = "none";

        document.getElementById("resultBox").style.display = "block";

        document.getElementById("resultBox").innerHTML =
        data.reply;

    };

    reader.readAsDataURL(uploadedFile);

}

</script>

</body>
</html>
