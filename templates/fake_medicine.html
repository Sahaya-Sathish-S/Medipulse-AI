<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse AI - Fake Medicine Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Poppins',sans-serif;
    background:linear-gradient(rgba(0,0,0,0.85),rgba(0,0,0,0.85)),url("{{ url_for('static', filename='images/background.png') }}");
    background-size:cover; background-position:center; background-attachment:fixed;
    color:#fff; min-height:100vh; overflow-x:hidden;
}
.top-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:25px 50px; background:rgba(0,0,0,0.3);
    backdrop-filter:blur(10px); border-bottom:1px solid rgba(0,217,255,0.15);
}
.logo-group { display:flex; align-items:center; gap:12px; }
.logo-group i { color:#00D9FF; font-size:28px; animation:pulseGlow 2s infinite alternate; }
.logo { font-size:28px; font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:2px; color:#00D9FF; text-shadow:0 0 15px rgba(0,217,255,0.4); }
.profile-icon { width:50px; height:50px; border-radius:50%; overflow:hidden; border:2px solid #ff00ff; box-shadow:0 0 15px rgba(255,0,255,0.3); transition:0.3s ease; }
.profile-icon:hover { transform:scale(1.08) rotate(5deg); }
.profile-icon img { width:100%; height:100%; object-fit:cover; }

.container { max-width:1000px; margin:40px auto; padding:0 20px 70px; }

.dashboard-header { text-align:center; margin-bottom:36px; }
.dashboard-header h1 { font-family:'Orbitron',sans-serif; font-size:34px; letter-spacing:1px; margin-bottom:10px; }
.dashboard-header h1 span { color:#ff3366; text-shadow:0 0 20px rgba(255,51,102,0.6); }
.dashboard-header p { color:#b0c4de; font-size:15px; max-width:560px; margin:0 auto; }

/* ============ UPLOAD PANEL ============ */
.glass-panel {
    background:rgba(10,25,50,0.45); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(0,217,255,0.15); border-radius:24px; padding:36px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative; overflow:hidden; margin-bottom:30px;
}
.glass-panel::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:4px;
    background:linear-gradient(90deg,#ff3366,#ff00ff,#00D9FF); background-size:200% auto;
    animation:moveGradient 4s linear infinite;
}

.dropzone {
    border:2px dashed rgba(0,217,255,0.3); border-radius:18px; padding:40px 20px;
    text-align:center; cursor:pointer; transition:all 0.3s; position:relative;
    background:rgba(255,255,255,0.02);
}
.dropzone:hover, .dropzone.drag-over { border-color:#00D9FF; background:rgba(0,217,255,0.05); box-shadow:0 0 25px rgba(0,217,255,0.15) inset; }
.dropzone i { font-size:42px; color:#00D9FF; margin-bottom:14px; text-shadow:0 0 15px rgba(0,217,255,0.4); }
.dropzone h3 { font-family:'Orbitron',sans-serif; font-size:15px; letter-spacing:1px; margin-bottom:6px; }
.dropzone p { color:#a0aec0; font-size:12.5px; }
#fileInput, #cameraInput { display:none; }

.upload-actions { display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.pill-btn {
    background:rgba(255,255,255,0.06); border:1px solid rgba(0,217,255,0.25); color:#fff;
    font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; padding:11px 22px;
    border-radius:50px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:0.3s;
}
.pill-btn:hover { background:rgba(0,217,255,0.15); box-shadow:0 0 15px rgba(0,217,255,0.25); transform:translateY(-2px); }
.pill-btn.camera { border-color:rgba(255,51,102,0.35); }
.pill-btn.camera:hover { background:rgba(255,51,102,0.15); box-shadow:0 0 15px rgba(255,51,102,0.25); }

/* preview + scan stage */
.preview-wrap { display:none; flex-direction:column; align-items:center; gap:22px; margin-top:10px; }
.scan-frame {
    position:relative; width:280px; height:280px; border-radius:20px; overflow:hidden;
    border:1px solid rgba(0,217,255,0.3); box-shadow:0 15px 40px rgba(0,0,0,0.5);
    background:#050b16;
}
.scan-frame img { width:100%; height:100%; object-fit:cover; display:block; }
.scan-overlay {
    position:absolute; inset:0; display:none; background:rgba(0,10,25,0.25);
    border:1px solid rgba(0,217,255,0.5); box-shadow:0 0 25px rgba(0,217,255,0.35) inset;
}
.scan-overlay.active { display:block; }
.scan-line {
    position:absolute; left:0; width:100%; height:3px;
    background:linear-gradient(90deg,transparent,#00D9FF,#00ffaa,#00D9FF,transparent);
    box-shadow:0 0 18px 4px rgba(0,217,255,0.7);
    animation:scanMove 1.8s ease-in-out infinite;
}
.scan-grid {
    position:absolute; inset:0;
    background-image:
        linear-gradient(rgba(0,217,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,0.08) 1px, transparent 1px);
    background-size:20px 20px;
    animation:gridPulse 2.4s ease-in-out infinite;
}
.corner { position:absolute; width:22px; height:22px; border-color:#00ffaa; }
.corner.tl { top:6px; left:6px; border-top:3px solid; border-left:3px solid; }
.corner.tr { top:6px; right:6px; border-top:3px solid; border-right:3px solid; }
.corner.bl { bottom:6px; left:6px; border-bottom:3px solid; border-left:3px solid; }
.corner.br { bottom:6px; right:6px; border-bottom:3px solid; border-right:3px solid; }

.scan-status { font-family:'Orbitron',sans-serif; font-size:12.5px; color:#00D9FF; letter-spacing:1.5px; text-transform:uppercase; min-height:18px; animation:pulseGlow 1.4s infinite alternate; }

.scan-cta { display:flex; gap:14px; }
.scan-btn {
    background:linear-gradient(45deg,#ff3366,#ff00ff,#7b2cff); background-size:200% auto;
    color:#fff; font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:1px; padding:15px 38px; border:none; border-radius:50px; cursor:pointer;
    box-shadow:0 0 25px rgba(255,51,102,0.3); transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    animation:moveGradient 3s linear infinite;
}
.scan-btn:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 0 35px rgba(255,0,255,0.5); }
.scan-btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; }
.reset-btn {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:#b0c4de;
    font-family:'Poppins',sans-serif; font-size:13px; padding:15px 24px; border-radius:50px; cursor:pointer; transition:0.3s;
}
.reset-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }

/* ============ RESULTS ============ */
.results-panel { display:none; animation:slideUpFade 0.6s ease forwards; }

.verdict-card {
    border-radius:22px; padding:34px; position:relative; overflow:hidden;
    background:rgba(10,25,50,0.55); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 50px rgba(0,0,0,0.5);
    margin-bottom:26px; display:flex; gap:34px; flex-wrap:wrap; align-items:center;
}
.verdict-card.v-genuine { border-color:rgba(0,255,170,0.4); box-shadow:0 0 40px rgba(0,255,170,0.12), 0 20px 50px rgba(0,0,0,0.5); }
.verdict-card.v-suspicious { border-color:rgba(255,170,0,0.45); box-shadow:0 0 40px rgba(255,170,0,0.14), 0 20px 50px rgba(0,0,0,0.5); }
.verdict-card.v-fake { border-color:rgba(255,51,102,0.5); box-shadow:0 0 40px rgba(255,51,102,0.18), 0 20px 50px rgba(0,0,0,0.5); }
.verdict-card.v-unclear { border-color:rgba(160,174,192,0.4); }

.gauge-wrap { position:relative; width:170px; height:100px; flex-shrink:0; }
.gauge-wrap svg { width:100%; height:100%; overflow:visible; }
.gauge-label { position:absolute; bottom:0; left:0; right:0; text-align:center; }
.gauge-label .num { font-family:'Orbitron',sans-serif; font-size:30px; font-weight:900; }
.gauge-label .txt { font-size:10.5px; color:#a0aec0; letter-spacing:1.5px; text-transform:uppercase; }

.verdict-main { flex:1; min-width:220px; }
.verdict-badge {
    display:inline-flex; align-items:center; gap:10px; font-family:'Orbitron',sans-serif;
    font-size:20px; font-weight:700; letter-spacing:1px; padding:8px 4px; margin-bottom:10px;
}
.verdict-badge i { font-size:24px; }
.v-genuine .verdict-badge, .v-genuine .num { color:#00ffaa; text-shadow:0 0 15px rgba(0,255,170,0.5); }
.v-suspicious .verdict-badge, .v-suspicious .num { color:#ffaa00; text-shadow:0 0 15px rgba(255,170,0,0.5); }
.v-fake .verdict-badge, .v-fake .num { color:#ff3366; text-shadow:0 0 15px rgba(255,51,102,0.5); }
.v-unclear .verdict-badge, .v-unclear .num { color:#a0aec0; }
.verdict-summary { color:#dbe4f0; font-size:14px; line-height:1.6; }

.details-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;
}
.detail-box {
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:16px 18px;
}
.detail-box p { font-size:10.5px; color:#a0aec0; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.detail-box h4 { font-size:14.5px; font-weight:600; color:#fff; word-break:break-word; }

.flag-columns { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:26px; }
@media(max-width:700px){ .flag-columns{ grid-template-columns:1fr; } }
.flag-block {
    background:rgba(255,255,255,0.03); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.07);
}
.flag-block h5 {
    font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.flag-block.risks h5 { color:#ff3366; }
.flag-block.checks h5 { color:#00ffaa; }
.flag-block ul { list-style:none; display:flex; flex-direction:column; gap:10px; }
.flag-block li { font-size:13px; color:#dbe4f0; display:flex; gap:10px; align-items:flex-start; line-height:1.5; }
.flag-block li i { margin-top:3px; flex-shrink:0; }
.flag-block.risks li i { color:#ff3366; }
.flag-block.checks li i { color:#00ffaa; }
.flag-block .empty-note { font-size:12.5px; color:#6b7d99; font-style:italic; }

.disclaimer-box {
    background:rgba(255,51,102,0.08); border:1px solid rgba(255,51,102,0.3); border-radius:16px;
    padding:20px 22px; display:flex; gap:14px; align-items:flex-start; margin-bottom:24px;
}
.disclaimer-box i { color:#ff3366; font-size:20px; margin-top:2px; flex-shrink:0; }
.disclaimer-box p { font-size:12.5px; color:#e8c9d2; line-height:1.6; }
.disclaimer-box strong { color:#fff; }

.results-cta { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

/* ============ STATES ============ */
.state-message {
    text-align:center; padding:50px 20px; font-size:14.5px; color:#a0aec0;
    display:flex; flex-direction:column; align-items:center; gap:14px;
}
.state-message i { font-size:38px; color:rgba(255,51,102,0.4); }

@keyframes moveGradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
@keyframes pulseGlow { 0%{opacity:0.5;} 100%{opacity:1;} }
@keyframes scanMove { 0%{top:4%;} 50%{top:92%;} 100%{top:4%;} }
@keyframes gridPulse { 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }
@keyframes slideUpFade { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

@media(max-width:768px){
    .top-bar{padding:18px 20px} .dashboard-header h1{font-size:26px}
    .glass-panel{padding:24px} .scan-frame{width:100%; max-width:280px;}
    .verdict-card{padding:24px; gap:22px;}
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo-group">
        <i class="fa-solid fa-microchip"></i>
        <div class="logo">MediPulse</div>
    </div>
    <div class="profile-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
    </div>
</div>

<div class="container">

    <div class="dashboard-header">
        <h1>Fake Medicine <span>Detector</span></h1>
        <p>Snap or upload a photo of the strip, bottle, or box. Our AI screens the packaging for signs of counterfeiting before you take a single dose.</p>
    </div>

    <div class="glass-panel">

        <div class="dropzone" id="dropzone">
            <i class="fa-solid fa-pills"></i>
            <h3>DROP MEDICINE IMAGE HERE</h3>
            <p>Clear photo of the label, strip, or box &bull; JPG / PNG</p>
        </div>

        <div class="upload-actions" id="uploadActions">
            <button class="pill-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-folder-open"></i> Choose File
            </button>
            <button class="pill-btn camera" onclick="document.getElementById('cameraInput').click()">
                <i class="fa-solid fa-camera"></i> Use Camera
            </button>
        </div>
        <input type="file" id="fileInput" accept="image/*">
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <div class="preview-wrap" id="previewWrap">
            <div class="scan-frame" id="scanFrame">
                <img id="previewImg" src="" alt="Medicine preview">
                <div class="scan-overlay" id="scanOverlay">
                    <div class="scan-grid"></div>
                    <div class="scan-line"></div>
                    <span class="corner tl"></span><span class="corner tr"></span>
                    <span class="corner bl"></span><span class="corner br"></span>
                </div>
            </div>
            <div class="scan-status" id="scanStatus"></div>
            <div class="scan-cta">
                <button class="scan-btn" id="scanBtn" onclick="analyzeMedicine()">
                    <i class="fa-solid fa-shield-halved" style="margin-right:8px;"></i>SCAN FOR AUTHENTICITY
                </button>
                <button class="reset-btn" onclick="resetTool()">
                    <i class="fa-solid fa-rotate-left" style="margin-right:6px;"></i>Reset
                </button>
            </div>
        </div>

    </div>

    <div id="resultsContainer"></div>

</div>

<script>
let currentBase64 = "";
let currentFileType = "image/jpeg";

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");
const previewWrap = document.getElementById("previewWrap");
const previewImg = document.getElementById("previewImg");
const uploadActions = document.getElementById("uploadActions");
const scanOverlay = document.getElementById("scanOverlay");
const scanStatus = document.getElementById("scanStatus");
const scanBtn = document.getElementById("scanBtn");
const resultsContainer = document.getElementById("resultsContainer");

dropzone.addEventListener("click", () => fileInput.click());
["dragover","dragenter"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("drag-over"); }));
["dragleave","drop"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("drag-over"); }));
dropzone.addEventListener("drop", e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

fileInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
cameraInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
    if (!file.type.startsWith("image/")) { alert("Please upload an image file."); return; }
    currentFileType = file.type;
    const reader = new FileReader();
    reader.onload = e => {
        currentBase64 = e.target.result;
        previewImg.src = currentBase64;
        dropzone.style.display = "none";
        uploadActions.style.display = "none";
        previewWrap.style.display = "flex";
        resultsContainer.innerHTML = "";
    };
    reader.readAsDataURL(file);
}

function resetTool() {
    currentBase64 = "";
    fileInput.value = ""; cameraInput.value = "";
    dropzone.style.display = "block";
    uploadActions.style.display = "flex";
    previewWrap.style.display = "none";
    scanOverlay.classList.remove("active");
    scanBtn.disabled = false;
    scanBtn.innerHTML = '<i class="fa-solid fa-shield-halved" style="margin-right:8px;"></i>SCAN FOR AUTHENTICITY';
    scanStatus.textContent = "";
    resultsContainer.innerHTML = "";
}

const scanMessages = [
    "Reading label & printing quality...",
    "Cross-checking batch & expiry details...",
    "Inspecting fonts & seal integrity...",
    "Weighing authenticity signals..."
];

function backendOrigin() {
    return (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
        ? "" : "https://medipulse-ai-i9ox.onrender.com";
}

async function analyzeMedicine() {
    if (!currentBase64) { alert("Please add a medicine image first."); return; }

    scanBtn.disabled = true;
    scanBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i>SCANNING...';
    scanOverlay.classList.add("active");
    resultsContainer.innerHTML = "";

    let msgIndex = 0;
    scanStatus.textContent = scanMessages[0];
    const msgTimer = setInterval(() => {
        msgIndex = (msgIndex + 1) % scanMessages.length;
        scanStatus.textContent = scanMessages[msgIndex];
    }, 1400);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    try {
        const response = await fetch(`${backendOrigin()}/api/detect_fake_medicine`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file_content: currentBase64, file_type: currentFileType }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        const result = await response.json();

        if (result.status !== "success") {
            renderError(result.message || "Could not analyze this image. Please try a clearer photo.");
        } else {
            renderResults(result);
        }
    } catch (err) {
        renderError(err.name === "AbortError" ? "Request timed out. The server may be waking up — please try again." : "Network error: " + err.message);
    } finally {
        clearInterval(msgTimer);
        scanOverlay.classList.remove("active");
        scanBtn.disabled = false;
        scanBtn.innerHTML = '<i class="fa-solid fa-shield-halved" style="margin-right:8px;"></i>SCAN FOR AUTHENTICITY';
    }
}

function renderError(msg) {
    resultsContainer.innerHTML = `
    <div class="state-message">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>${msg}</p>
    </div>`;
}

const verdictConfig = {
    genuine:   { cls:"v-genuine",   icon:"fa-shield-heart",         label:"LIKELY GENUINE",      color:"#00ffaa" },
    suspicious:{ cls:"v-suspicious",icon:"fa-triangle-exclamation", label:"SUSPICIOUS \u2014 VERIFY FURTHER", color:"#ffaa00" },
    fake:      { cls:"v-fake",      icon:"fa-skull-crossbones",     label:"HIGH RISK \u2014 POSSIBLE FAKE", color:"#ff3366" },
    unclear:   { cls:"v-unclear",   icon:"fa-circle-question",      label:"UNCLEAR \u2014 RETRY WITH BETTER PHOTO", color:"#a0aec0" }
};

function buildGaugeSVG(confidence, color) {
    // semicircle gauge, 160 wide x 90 tall, arc from 180deg to 0deg
    const r = 70, cx = 85, cy = 85;
    const pct = Math.max(0, Math.min(100, confidence)) / 100;
    const angle = Math.PI - (pct * Math.PI); // from 180deg(left) to 0deg(right)
    const x = cx + r * Math.cos(angle);
    const y = cy - r * Math.sin(angle);
    const largeArc = pct > 0.5 ? 1 : 0;
    const trackPath = `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy}`;
    const valuePath = `M ${cx-r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${x} ${y}`;
    return `
    <svg viewBox="0 0 170 100">
        <path d="${trackPath}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-linecap="round"/>
        <path d="${valuePath}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
              style="filter:drop-shadow(0 0 8px ${color});"/>
    </svg>`;
}

function esc(s) { return (s || "").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderResults(data) {
    const v = verdictConfig[data.verdict] || verdictConfig.unclear;
    const confidence = typeof data.confidence === "number" ? data.confidence : 0;

    const redFlags = Array.isArray(data.red_flags) ? data.red_flags : [];
    const positives = Array.isArray(data.positive_signs) ? data.positive_signs : [];

    const flagsHTML = redFlags.length
        ? redFlags.map(f => `<li><i class="fa-solid fa-circle-exclamation"></i>${esc(f)}</li>`).join("")
        : `<li class="empty-note">No packaging red flags detected.</li>`;

    const posHTML = positives.length
        ? positives.map(p => `<li><i class="fa-solid fa-circle-check"></i>${esc(p)}</li>`).join("")
        : `<li class="empty-note">No confirmable authenticity markers found.</li>`;

    resultsContainer.innerHTML = `
    <div class="results-panel" style="display:block;">

        <div class="verdict-card ${v.cls}">
            <div class="gauge-wrap">
                ${buildGaugeSVG(confidence, v.color)}
                <div class="gauge-label">
                    <div class="num">${confidence}%</div>
                    <div class="txt">Confidence</div>
                </div>
            </div>
            <div class="verdict-main">
                <div class="verdict-badge"><i class="fa-solid ${v.icon}"></i>${v.label}</div>
                <div class="verdict-summary">${esc(data.summary || "")}</div>
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-box"><p>Medicine Name</p><h4>${esc(data.medicine_name) || "Not detected"}</h4></div>
            <div class="detail-box"><p>Manufacturer</p><h4>${esc(data.manufacturer) || "Not detected"}</h4></div>
            <div class="detail-box"><p>Batch No.</p><h4>${esc(data.batch_no) || "Not detected"}</h4></div>
            <div class="detail-box"><p>Mfg / Exp Date</p><h4>${esc(data.mfg_date) || "N/A"} &rarr; ${esc(data.exp_date) || "N/A"}</h4></div>
        </div>

        <div class="flag-columns">
            <div class="flag-block risks">
                <h5><i class="fa-solid fa-bug"></i>Red Flags</h5>
                <ul>${flagsHTML}</ul>
            </div>
            <div class="flag-block checks">
                <h5><i class="fa-solid fa-check-double"></i>Authenticity Signs</h5>
                <ul>${posHTML}</ul>
            </div>
        </div>

        <div class="disclaimer-box">
            <i class="fa-solid fa-circle-info"></i>
            <p><strong>AI preliminary screening only.</strong> ${esc(data.disclaimer) || "This tool flags visual signs of counterfeit packaging but cannot chemically verify a medicine. Never consume a medicine flagged as suspicious or fake \u2014 confirm with your pharmacist, the manufacturer's verification helpline, or your country's official drug-authentication portal, and report suspected counterfeits to the nearest hospital or regulator."}</p>
        </div>

        <div class="results-cta">
            <button class="pill-btn" onclick="resetTool()"><i class="fa-solid fa-camera-rotate"></i> Scan Another</button>
        </div>
    </div>`;
}
</script>
</body>
</html>
