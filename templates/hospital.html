<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Features</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: url("{{ url_for('static', filename='images/background.png') }}") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 36px;
            letter-spacing: 1px;
        }

        .features {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .card i {
            font-size: 40px;
            margin-bottom: 15px;
            color: #00e6e6;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            opacity: 0.9;
        }
  
        .feature-nav-btn{

            margin-top:15px;

            padding:12px 18px;

            border:none;

            border-radius:14px;

            cursor:pointer;

            color:white;

            font-weight:600;

            width:100%;

            background:
            linear-gradient(
                135deg,
                #00d9ff,
                #7b2cff,
                #ff00ff
            );

            transition:0.3s;
        }
       
        .feature-nav-btn:hover{

            transform:translateY(-3px);

            box-shadow:
            0 0 15px #00d9ff;
        }
    </style>

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="overlay"></div>

    <div class="container">
        <h1>Hospital Smart Features</h1>

        <div class="features">

            <div class="card">
                <i class="fa-solid fa-hand-holding-medical"></i>
                <h2>Blood Donation System</h2>
                <p>Connect donors instantly with hospitals and save lives through quick blood matching.</p>
              <a href="/donation">

                    <button class="feature-nav-btn">
                        Blood Donator
                    </button>

                </a>
            </div>

            <div class="card">
                <i class="fa-solid fa-eye"></i>
                <h2>AI Eye Scanner</h2>
                <p>Advanced AI-based eye screening for early detection of diseases and vision problems.</p>
              <a href="/scanner">

                    <button class="feature-nav-btn">
                        AI Scan
                    </button>

                </a>
            </div>

        </div>
    </div>

</body>

</html>
