<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse AI - Emergency Blood Search</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Poppins',sans-serif;
    background:linear-gradient(rgba(0,0,0,0.82),rgba(0,0,0,0.82)),url("{{ url_for('static', filename='images/background.png') }}");
    background-size:cover; background-position:center; background-attachment:fixed;
    color:#fff; min-height:100vh; overflow-x:hidden;
}
.top-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:25px 50px; background:rgba(0,0,0,0.3);
    backdrop-filter:blur(10px); border-bottom:1px solid rgba(0,217,255,0.15);
}
.logo-group { display:flex; align-items:center; gap:12px; }
.logo-group i { color:#00D9FF; font-size:28px; animation:pulseGlow 2s infinite alternate; }
.logo { font-size:28px; font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:2px; color:#00D9FF; text-shadow:0 0 15px rgba(0,217,255,0.4); }
.profile-icon { width:50px; height:50px; border-radius:50%; overflow:hidden; border:2px solid #ff00ff; box-shadow:0 0 15px rgba(255,0,255,0.3); transition:0.3s ease; }
.profile-icon:hover { transform:scale(1.08) rotate(5deg); }
.profile-icon img { width:100%; height:100%; object-fit:cover; }

.container { max-width:1100px; margin:40px auto; padding:0 20px 60px; }

.dashboard-header { text-align:center; margin-bottom:40px; }
.dashboard-header h1 { font-family:'Orbitron',sans-serif; font-size:36px; color:#fff; letter-spacing:1px; margin-bottom:10px; }
.dashboard-header h1 span { color:#ff3366; text-shadow:0 0 20px rgba(255,51,102,0.6); }
.dashboard-header p { color:#b0c4de; font-size:16px; }

/* SEARCH PANEL */
.glass-panel {
    background:rgba(10,25,50,0.45); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(0,217,255,0.15); border-radius:24px; padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative; overflow:hidden; margin-bottom:35px;
}
.glass-panel::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:4px;
    background:linear-gradient(90deg,#ff3366,#ff00ff,#00D9FF); background-size:200% auto;
    animation:moveGradient 4s linear infinite;
}

.search-row {
    display:flex; align-items:flex-end; gap:15px; flex-wrap:wrap;
}

.search-group { display:flex; flex-direction:column; gap:7px; }
.search-group label { font-size:11px; font-weight:600; color:#a0aec0; text-transform:uppercase; letter-spacing:1px; }
.blood-select {
    background:rgba(255,255,255,0.06); border:1px solid rgba(0,217,255,0.2);
    border-radius:12px; padding:13px 20px; color:#fff; font-family:'Poppins',sans-serif;
    font-size:15px; outline:none; transition:all 0.3s; min-width:180px; cursor:pointer;
}
.blood-select option { background:#0a1932; color:#fff; }
.blood-select:focus { border-color:#ff3366; box-shadow:0 0 15px rgba(255,51,102,0.2); }

.search-btn {
    background:linear-gradient(45deg,#ff3366,#ff00ff,#7b2cff); background-size:200% auto;
    color:#fff; font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:1px; padding:14px 35px; border:none; border-radius:50px; cursor:pointer;
    box-shadow:0 0 25px rgba(255,51,102,0.3); transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    animation:moveGradient 3s linear infinite; white-space:nowrap;
}
.search-btn:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 0 35px rgba(255,0,255,0.5); }

/* STAT STRIP */
.stat-strip {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; margin-top:25px;
}
.stat-badge {
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
    border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;
}
.stat-badge i { font-size:18px; color:#ff3366; }
.stat-badge div p { font-size:10px; color:#a0aec0; text-transform:uppercase; letter-spacing:1px; }
.stat-badge div h4 { font-size:15px; color:#fff; font-weight:600; }

/* LOADER */
.hologram-loader { display:none; flex-direction:column; align-items:center; justify-content:center; margin:40px 0; gap:20px; }
.cyber-spinner { width:65px; height:65px; border:3px solid transparent; border-top-color:#ff3366; border-bottom-color:#ff00ff; border-radius:50%; animation:spinCyber 1.5s linear infinite; position:relative; }
.cyber-spinner::after { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; border:3px solid transparent; border-left-color:#00ffaa; border-radius:50%; animation:spinCyber 3s linear infinite reverse; }
.loader-status-text { font-family:'Orbitron',sans-serif; font-size:13px; color:#ff3366; letter-spacing:2px; text-transform:uppercase; animation:pulseGlowRed 1.5s infinite alternate; }

/* RESULTS */
.results-header {
    font-family:'Orbitron',sans-serif; font-size:16px; color:#00D9FF;
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
}

.results-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:22px; }

.donor-card {
    background:rgba(10,25,50,0.5); backdrop-filter:blur(20px);
    border:1px solid rgba(0,217,255,0.12); border-radius:20px; padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); position:relative; overflow:hidden;
    transition:transform 0.3s, box-shadow 0.3s;
}
.donor-card:hover { transform:translateY(-4px); box-shadow:0 15px 40px rgba(0,217,255,0.15); }
.donor-card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:3px;
    background:linear-gradient(90deg,#ff3366,#ff00ff); opacity:0.7;
}

.donor-card-header { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.donor-avatar {
    width:48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg,#ff3366,#7b2cff);
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron',sans-serif; font-size:16px; font-weight:700; color:#fff;
    flex-shrink:0; box-shadow:0 0 12px rgba(255,51,102,0.4);
}
.donor-name { font-size:16px; font-weight:600; color:#fff; }
.donor-age { font-size:12px; color:#a0aec0; }

.blood-badge {
    margin-left:auto; background:rgba(255,51,102,0.15); border:1px solid rgba(255,51,102,0.3);
    border-radius:8px; padding:6px 12px; font-family:'Orbitron',sans-serif;
    font-size:14px; font-weight:700; color:#ff3366;
}

.donor-info { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
.info-row { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#b0c4de; }
.info-row i { color:#00D9FF; font-size:13px; margin-top:2px; flex-shrink:0; width:14px; }

.action-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.action-row .action-btn-full { grid-column:span 2; }

.action-btn {
    padding:11px 14px; border-radius:10px; border:none; font-family:'Poppins',sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; transition:all 0.3s; width:100%; text-align:center;
}
.btn-call { background:rgba(0,255,170,0.12); border:1px solid rgba(0,255,170,0.3); color:#00ffaa; }
.btn-call:hover { background:rgba(0,255,170,0.22); box-shadow:0 0 12px rgba(0,255,170,0.3); }
.btn-copy { background:rgba(0,217,255,0.1); border:1px solid rgba(0,217,255,0.25); color:#00D9FF; }
.btn-copy:hover { background:rgba(0,217,255,0.2); box-shadow:0 0 12px rgba(0,217,255,0.3); }
.btn-email { background:rgba(123,44,255,0.15); border:1px solid rgba(123,44,255,0.35); color:#b480ff; }
.btn-email:hover { background:rgba(123,44,255,0.25); box-shadow:0 0 12px rgba(123,44,255,0.3); }
.btn-email:disabled { opacity:0.5; cursor:not-allowed; }

/* EMPTY / ERROR STATES */
.state-message {
    text-align:center; padding:60px 20px;
    font-size:15px; color:#a0aec0;
    display:flex; flex-direction:column; align-items:center; gap:15px;
}
.state-message i { font-size:40px; color:rgba(0,217,255,0.3); }

@keyframes moveGradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
@keyframes spinCyber { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
@keyframes pulseGlow { 0%{opacity:0.4;text-shadow:0 0 5px rgba(0,217,255,0.2)} 100%{opacity:1;text-shadow:0 0 15px rgba(0,217,255,0.7)} }
@keyframes pulseGlowRed { 0%{opacity:0.4;text-shadow:0 0 5px rgba(255,51,102,0.2)} 100%{opacity:1;text-shadow:0 0 15px rgba(255,51,102,0.7)} }
@keyframes slideUpFade { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

@media(max-width:768px){
    .top-bar{padding:18px 20px} .dashboard-header h1{font-size:26px}
    .glass-panel{padding:25px} .search-row{flex-direction:column}
    .blood-select,.search-btn{width:100%} .results-grid{grid-template-columns:1fr}
    .action-row{grid-template-columns:1fr} .action-btn-full{grid-column:span 1}
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo-group">
        <i class="fa-solid fa-microchip"></i>
        <div class="logo">MediPulse</div>
    </div>
    <div class="profile-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
    </div>
</div>

<div class="container">

    <div class="dashboard-header">
        <h1>Emergency <span>Blood</span> Search</h1>
        <p>Locate verified active donors in the MediPulse network by blood type instantly.</p>
    </div>

    <div class="glass-panel">
        <div class="search-row">
            <div class="search-group">
                <label><i class="fa-solid fa-droplet" style="color:#ff3366;margin-right:5px;"></i> Blood Group Required</label>
                <select id="blood_group" class="blood-select">
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option>
                    <option>AB+</option><option>AB-</option>
                </select>
            </div>
            <button class="search-btn" onclick="searchDonors()">
                <i class="fa-solid fa-magnifying-glass" style="margin-right:8px;"></i> SEARCH DONORS
            </button>
        </div>

        <div class="stat-strip" id="statStrip" style="display:none;">
            <div class="stat-badge">
                <i class="fa-solid fa-users"></i>
                <div><p>Donors Found</p><h4 id="statCount">0</h4></div>
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-droplet" style="color:#ff3366;"></i>
                <div><p>Blood Type</p><h4 id="statBlood">--</h4></div>
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-circle-check" style="color:#00ffaa;"></i>
                <div><p>Status</p><h4>Available</h4></div>
            </div>
        </div>
    </div>

    <div class="hologram-loader" id="searchLoader">
        <div class="cyber-spinner"></div>
        <div class="loader-status-text">Scanning donor database...</div>
    </div>

    <div id="resultsContainer"></div>

</div>

<script>
const supabaseUrl = "https://covmgrilycetqtpwolfl.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvdm1ncmlseWNldHF0cHdvbGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjE4OTcsImV4cCI6MjA5NDczNzg5N30.nu-_HD1m-7FlOfwWo0zzBvCdRBPb_vQWyvYwhkNHnQc";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function getInitials(name) {
    return name ? name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) : '??';
}

async function searchDonors() {
    const group = document.getElementById("blood_group").value;
    const loader = document.getElementById("searchLoader");
    const container = document.getElementById("resultsContainer");
    const strip = document.getElementById("statStrip");

    container.innerHTML = "";
    strip.style.display = "none";
    loader.style.display = "flex";

    const { data, error } = await supabaseClient
        .from("donors").select("*")
        .eq("blood_group", group).eq("available", true);

    loader.style.display = "none";

    if (error) {
        container.innerHTML = `<div class="state-message"><i class="fa-solid fa-triangle-exclamation"></i><p>Error fetching donor records. Please try again.</p></div>`;
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = `<div class="state-message"><i class="fa-solid fa-user-slash"></i><p>No active donors found for blood group <strong>${group}</strong>. Try another type.</p></div>`;
        return;
    }

    strip.style.display = "grid";
    document.getElementById("statCount").innerText = data.length;
    document.getElementById("statBlood").innerText = group;

    container.innerHTML = `<div class="results-header"><i class="fa-solid fa-heart-pulse"></i> ${data.length} Active Donor${data.length > 1 ? 's' : ''} Found</div><div class="results-grid" id="donorGrid"></div>`;

    const grid = document.getElementById("donorGrid");
    data.forEach(d => {
        const esc = s => (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        grid.innerHTML += `
        <div class="donor-card" style="animation:slideUpFade 0.5s ease forwards;">
            <div class="donor-card-header">
                <div class="donor-avatar">${getInitials(d.full_name)}</div>
                <div>
                    <div class="donor-name">${d.full_name || 'Anonymous'}</div>
                    <div class="donor-age">${d.age ? d.age + ' years old' : 'Age N/A'} &bull; ${d.occupation_status || ''}</div>
                </div>
                <div class="blood-badge">${d.blood_group}</div>
            </div>
            <div class="donor-info">
                <div class="info-row"><i class="fa-solid fa-location-dot"></i><span>${d.address || 'Address not provided'}</span></div>
                <div class="info-row"><i class="fa-solid fa-phone"></i><span>${d.phone || 'N/A'}</span></div>
                ${d.email ? `<div class="info-row"><i class="fa-solid fa-envelope"></i><span>${d.email}</span></div>` : ''}
                ${d.smoking === 'Yes' || d.alcohol_usage === 'Yes' ? `
                <div class="info-row">
                    <i class="fa-solid fa-circle-info" style="color:#ffaa00;"></i>
                    <span style="color:#ffaa00;">
                        ${d.smoking === 'Yes' ? 'Smoker' : ''}${d.smoking === 'Yes' && d.alcohol_usage === 'Yes' ? ' &bull; ' : ''}${d.alcohol_usage === 'Yes' ? 'Alcohol user' : ''}
                    </span>
                </div>` : ''}
            </div>
            <div class="action-row">
                <a href="tel:${d.phone}" style="text-decoration:none;">
                    <button class="action-btn btn-call"><i class="fa-solid fa-phone" style="margin-right:6px;"></i>Call Now</button>
                </a>
                <button class="action-btn btn-copy" onclick="copyNumber('${esc(d.phone)}')"><i class="fa-solid fa-copy" style="margin-right:6px;"></i>Copy No.</button>
                ${d.email ? `
                <button class="action-btn btn-email action-btn-full" id="mail-btn-${d.id}"
                    onclick="dispatchBackendEmail('${esc(d.email)}','${esc(d.full_name)}','${d.blood_group}','${d.id}')">
                    <i class="fa-solid fa-envelope" style="margin-right:6px;"></i>Send Emergency Email
                </button>` : ''}
            </div>
        </div>`;
    });
}

async function dispatchBackendEmail(toEmail, donorName, bloodGroup, donorId) {
    if (!toEmail) { alert("This donor has no registered email address."); return; }

    const btn = document.getElementById(`mail-btn-${donorId}`);
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i> Sending...';

    const backendOrigin = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
        ? "" : "https://medipulseai-vjk3.onrender.com";

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    try {
        const response = await fetch(`${backendOrigin}/api/send_emergency_email`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ to_email:toEmail, donor_name:donorName, blood_group:bloodGroup }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        const ct = response.headers.get("content-type");
        if (ct && ct.includes("application/json")) {
            const result = await response.json();
            alert(response.ok ? `✅ ${result.message || "Email sent!"}` : `❌ ${result.message}`);
        } else {
            const txt = await response.text();
            console.error("HTML error response:", txt);
            alert("❌ Server error. Check backend logs.");
        }
    } catch(err) {
        alert(err.name === 'AbortError' ? "❌ Request timed out. Server may be waking up — try again." : "❌ Network error: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
}

function copyNumber(num) {
    navigator.clipboard.writeText(num);
    alert("Phone number copied!");
}
</script>
</body>
</html>
