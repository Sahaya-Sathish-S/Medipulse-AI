<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediPulse Profile Setup</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.78),
    rgba(0,0,0,0.78)),
    url('/static/images/background.png');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;

    min-height:100vh;
}

/* TOP BAR */

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 40px;
}

.logo{

    font-size:32px;

    font-family:'Orbitron',sans-serif;

    color:#00D9FF;
}

.profile-icon{

    width:55px;
    height:55px;

    border-radius:50%;

    overflow:hidden;

    border:2px solid #00D9FF;
}

.profile-icon img{

    width:100%;
    height:100%;
    object-fit:cover;
}

/* CONTAINER */

.container{

    max-width:900px;

    margin:auto;

    padding:40px 20px;
}

/* CARD */

.form-card{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:30px;

    padding:40px;
}

/* STEP TITLE */

.step-title{

    font-size:32px;

    margin-bottom:10px;

    color:#00D9FF;
}

.step-sub{

    color:#ccc;

    margin-bottom:35px;
}

/* PROGRESS */

.progress-bar{

    width:100%;

    height:10px;

    border-radius:20px;

    background:rgba(255,255,255,0.1);

    margin-bottom:35px;

    overflow:hidden;
}

.progress{

    width:33%;

    height:100%;

    background:linear-gradient(90deg,#00D9FF,#ff00ff);

    border-radius:20px;

    transition:0.3s;
}

/* GRID */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

input,
select,
textarea{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:rgba(255,255,255,0.08);

    color:white;

    outline:none;

    font-size:15px;
}

textarea{

    min-height:140px;

    resize:none;
}

input::placeholder,
textarea::placeholder{

    color:#cccccc;
}

select option{

    color:black;
}

/* BUTTONS */

.buttons{

    display:flex;

    justify-content:space-between;

    margin-top:35px;
}

button{

    padding:16px 30px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-weight:600;

    transition:0.3s;
}

.next-btn{

    background:linear-gradient(45deg,#00D9FF,#0077ff);

    color:white;
}

.voice-btn{

    background:linear-gradient(45deg,#ff00ff,#ff6600);

    color:white;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

/* STEP */

.step{
    display:none;
}

.step.active{
    display:block;
}

/* RESPONSIVE */

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .top-bar{
        padding:20px;
    }

    .form-card{
        padding:25px;
    }

}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">

    <div class="logo">
        MediPulse
    </div>

    <div class="profile-icon">

        <img id="profileImage"
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    </div>

</div>

<div class="container">

<div class="form-card">

<div class="progress-bar">
    <div class="progress" id="progress"></div>
</div>

<!-- STEP 1 -->

<div class="step active" id="step1">

<h2 class="step-title">
Personal Information
</h2>

<p class="step-sub">
Tell us about yourself
</p>

<div class="form-grid">

<input type="text" id="fullName"
placeholder="Full Name">

<input type="number" id="age"
placeholder="Age">

<input type="date" id="dob">

<input type="text" id="phone"
placeholder="Phone Number">

<input type="text" id="bloodGroup"
placeholder="Blood Group">

<select id="gender">

<option value="">Gender</option>

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

<input type="text" id="occupation"
placeholder="Occupation">

<input type="text" id="studies"
placeholder="Studies Information">

<textarea id="address"
placeholder="Address"></textarea>

</div>

<div class="buttons">

<div></div>

<button class="next-btn"
onclick="nextStep(2)">
Next
</button>

</div>

</div>

<!-- STEP 2 -->

<div class="step" id="step2">

<h2 class="step-title">
Family Information
</h2>

<p class="step-sub">
Emergency & family details
</p>

<div class="form-grid">

<select id="maritalStatus">

<option value="">Marital Status</option>

<option>Married</option>
<option>Unmarried</option>

</select>

<input type="text"
id="fatherHusband"
placeholder="Father / Husband Name">

<input type="text"
id="motherWife"
placeholder="Mother / Wife Name">

<input type="text"
id="familyContact"
placeholder="Family Contact Number">

<input type="number"
id="familyAge"
placeholder="Parent / Partner Age">

<input type="text"
id="familyOccupation"
placeholder="Occupation">

</div>

<div class="buttons">

<button class="voice-btn"
onclick="prevStep(1)">
Back
</button>

<button class="next-btn"
onclick="nextStep(3)">
Next
</button>

</div>

</div>

<!-- STEP 3 -->

<div class="step" id="step3">

<h2 class="step-title">
Health Problems
</h2>

<p class="step-sub">
Type or speak your medical concerns
</p>

<textarea id="healthProblem"
placeholder="Describe your health problems..."></textarea>

<br><br>

<button class="voice-btn"
onclick="startVoice()">

<i class="fa-solid fa-microphone"></i>

Speak Health Problems

</button>

<div class="buttons">

<button class="voice-btn"
onclick="prevStep(2)">
Back
</button>

<button class="next-btn"
id="saveBtn"
onclick="saveProfile()">

Save & Continue

</button>

</div>

</div>

</div>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://covmgrilycetqtpwolfl.supabase.co"

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvdm1ncmlseWNldHF0cHdvbGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjE4OTcsImV4cCI6MjA5NDczNzg5N30.nu-_HD1m-7FlOfwWo0zzBvCdRBPb_vQWyvYwhkNHnQc"

const supabaseClient =
supabase.createClient(
    supabaseUrl,
    supabaseKey
)

/* ---------------- CHECK LOGIN ---------------- */

window.addEventListener(
    "DOMContentLoaded",
    async () => {

    const {
        data: { session }
    } =
    await supabaseClient
    .auth
    .getSession();

    if(!session){

        window.location.href =
        "/login";

        return;

    }

    const user = session.user;

    /* PROFILE IMAGE */

    if(user.user_metadata.avatar_url){

        document.getElementById(
            "profileImage"
        ).src =
        user.user_metadata.avatar_url;

    }

    /* CHECK PROFILE */

    const { data: profile } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("user_id", user.id)
    .maybeSingle();

    /* LOAD EXISTING DATA */

    if(profile){

        loadProfileData(profile);

    }

});

/* ---------------- LOAD PROFILE ---------------- */

function loadProfileData(profile){

    document.getElementById(
        "fullName"
    ).value =
    profile.full_name || "";

    document.getElementById(
        "age"
    ).value =
    profile.age || "";

    document.getElementById(
        "dob"
    ).value =
    profile.dob || "";

    document.getElementById(
        "phone"
    ).value =
    profile.phone || "";

    document.getElementById(
        "bloodGroup"
    ).value =
    profile.blood_group || "";

    document.getElementById(
        "gender"
    ).value =
    profile.gender || "";

    document.getElementById(
        "occupation"
    ).value =
    profile.occupation || "";

    document.getElementById(
        "studies"
    ).value =
    profile.studies || "";

    document.getElementById(
        "address"
    ).value =
    profile.address || "";

    document.getElementById(
        "maritalStatus"
    ).value =
    profile.marital_status || "";

    document.getElementById(
        "fatherHusband"
    ).value =
    profile.father_husband_name || "";

    document.getElementById(
        "motherWife"
    ).value =
    profile.mother_wife_name || "";

    document.getElementById(
        "familyContact"
    ).value =
    profile.family_contact || "";

    document.getElementById(
        "familyAge"
    ).value =
    profile.family_age || "";

    document.getElementById(
        "familyOccupation"
    ).value =
    profile.family_occupation || "";

    document.getElementById(
        "healthProblem"
    ).value =
    profile.health_problem || "";

}

/* ---------------- STEP SYSTEM ---------------- */

function nextStep(step){

    document.querySelectorAll('.step')
    .forEach(s =>
        s.classList.remove('active')
    );

    document.getElementById(
        'step' + step
    ).classList.add('active');

    updateProgress(step);

}

function prevStep(step){

    document.querySelectorAll('.step')
    .forEach(s =>
        s.classList.remove('active')
    );

    document.getElementById(
        'step' + step
    ).classList.add('active');

    updateProgress(step);

}

/* ---------------- PROGRESS ---------------- */

function updateProgress(step){

    let width = "33%";

    if(step === 2){
        width = "66%";
    }

    if(step === 3){
        width = "100%";
    }

    document.getElementById(
        "progress"
    ).style.width = width;

}

/* ---------------- DOB TO AGE ---------------- */

document.getElementById("dob")
.addEventListener("change", function(){

    let dob = new Date(this.value);

    let diff =
    Date.now() - dob.getTime();

    let ageDate =
    new Date(diff);

    let calculatedAge =
    Math.abs(
        ageDate.getUTCFullYear() - 1970
    );

    document.getElementById(
        "age"
    ).value =
    calculatedAge;

});

/* ---------------- VOICE ---------------- */

function startVoice(){

    const recognition =
    new(
        window.SpeechRecognition ||
        window.webkitSpeechRecognition
    )();

    recognition.lang = 'en-US';

    recognition.start();

    recognition.onresult =
    function(event){

        let text =
        event.results[0][0]
        .transcript;

        document.getElementById(
            "healthProblem"
        ).value = text;

    }

}

/* ---------------- SAVE PROFILE ---------------- */

async function saveProfile(){

    try{

        const {
            data: { session }
        } =
        await supabaseClient
        .auth
        .getSession();

        if(!session){

            alert(
                "Please login first"
            );

            return;

        }

        const user =
        session.user;

        const saveBtn =
        document.getElementById(
            "saveBtn"
        );

        saveBtn.innerHTML =
        "Saving...";

        saveBtn.disabled =
        true;

        const { error } =
        await supabaseClient
        .from("profiles")
        .upsert([{

            user_id:
            user.id,

            email:
            user.email,

            profile_photo:
            user.user_metadata.avatar_url,

            login_time:
            new Date(),

            full_name:
            document.getElementById(
                "fullName"
            ).value,

            age:
            document.getElementById(
                "age"
            ).value,

            dob:
            document.getElementById(
                "dob"
            ).value,

            phone:
            document.getElementById(
                "phone"
            ).value,

            blood_group:
            document.getElementById(
                "bloodGroup"
            ).value,

            gender:
            document.getElementById(
                "gender"
            ).value,

            occupation:
            document.getElementById(
                "occupation"
            ).value,

            studies:
            document.getElementById(
                "studies"
            ).value,

            address:
            document.getElementById(
                "address"
            ).value,

            marital_status:
            document.getElementById(
                "maritalStatus"
            ).value,

            father_husband_name:
            document.getElementById(
                "fatherHusband"
            ).value,

            mother_wife_name:
            document.getElementById(
                "motherWife"
            ).value,

            family_contact:
            document.getElementById(
                "familyContact"
            ).value,

            family_age:
            document.getElementById(
                "familyAge"
            ).value,

            family_occupation:
            document.getElementById(
                "familyOccupation"
            ).value,

            health_problem:
            document.getElementById(
                "healthProblem"
            ).value

        }], {

            onConflict:
            'user_id'

        });

        if(error){

            console.log(error)

            alert(error.message)

            saveBtn.innerHTML =
            "Save & Continue"

            saveBtn.disabled = false

            return
        }
        alert(
            "Informations Saved Successfully!"
        );

        window.location.href =
        "/";

    }

    catch(err){

        console.log(err);

        alert(
            "Something went wrong!"
        );

    }

}

</script>

</body>
</html>
