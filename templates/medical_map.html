<body>

🕒 <span id="liveClock"></span>
</div>

📡 Live GPS Active

<script>

let map;
let userLat = null;
let userLng = null;
let currentSpeed = 0;

let userMarker;
let routeLayer;

let destinationLat = null;
let destinationLng = null;
let destinationName = "";

let currentSteps = [];
let currentStepIndex = 0;
let navigationInterval = null;

let markers = [];

/* MAP */

map = L.map("map").setView([20.5937,78.9629],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    attribution:"© OpenStreetMap"
}
).addTo(map);

/* CLOCK */

setInterval(()=>{

    const now = new Date();

    document.getElementById("liveClock").innerText =
    now.toLocaleTimeString();

    document.getElementById("currentTime").innerText =
    now.toLocaleTimeString();

},1000);

/* LOCATION */

function enableLocation(){

    if(!navigator.geolocation){

        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.watchPosition(

        position=>{

            userLat = position.coords.latitude;
            userLng = position.coords.longitude;

            currentSpeed =
            position.coords.speed
            ? (position.coords.speed * 3.6).toFixed(1)
            : 0;

            document.getElementById("locationText").innerText =
            `${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;

            document.getElementById("speedText").innerText =
            `${currentSpeed} KM/H`;

            if(userMarker){

                map.removeLayer(userMarker);
            }

            userMarker =
            L.marker([userLat,userLng])
            .addTo(map)
            .bindPopup("You are here");

            map.setView([userLat,userLng],15);

            updateLiveDistance();

        },

        error=>{

            console.error(error);

            alert(
                "Please allow GPS permission"
            );

        },

        {
            enableHighAccuracy:true
        }

    );

    speakText("GPS enabled");

}

/* SEARCH */

async function searchNearby(type){

    if(!userLat || !userLng){

        alert("Enable location first");
        return;
    }

    document.getElementById("results").innerHTML =
    "Searching nearby places...";

    markers.forEach(marker=>{

        map.removeLayer(marker);

    });

    markers = [];

    let radius = 10000;

    let query = "";

    if(type === "pharmacy"){

        query = `
        [out:json][timeout:25];
        (
          node(around:${radius},${userLat},${userLng})["amenity"="pharmacy"];
          node(around:${radius},${userLat},${userLng})["shop"="chemist"];
          node(around:${radius},${userLat},${userLng})["healthcare"="pharmacy"];
          node(around:${radius},${userLat},${userLng})["dispensing"="yes"];
        );
        out body;
        `;

    }else{

        query = `
        [out:json][timeout:25];
        (
          node(around:${radius},${userLat},${userLng})["amenity"="hospital"];
          node(around:${radius},${userLat},${userLng})["healthcare"="hospital"];
        );
        out body;
        `;
    }

    try{

        const response =
        await fetch(
            "https://overpass-api.de/api/interpreter",
            {
                method:"POST",
                body:query
            }
        );

        const data =
        await response.json();

        displayPlaces(data.elements);

    }catch(err){

        console.error(err);

        document.getElementById("results").innerHTML =
        "Unable to fetch places";

    }

}

/* DISPLAY */

function displayPlaces(places){

    const results =
    document.getElementById("results");

    results.innerHTML = "";

    if(!places || places.length === 0){

        results.innerHTML =
        "No places found nearby";

        return;
    }

    places.forEach(place=>{

        const lat = place.lat;
        const lon = place.lon;

        if(!lat || !lon) return;

        const name =
        place.tags?.name ||
        "Medical Center";

        const distance =
        calculateDistance(
            userLat,
            userLng,
            lat,
            lon
        );

        const marker =
        L.marker([lat,lon])
        .addTo(map)
        .bindPopup(name);

        markers.push(marker);

        const card =
        document.createElement("div");

        card.className = "place-card";

        card.innerHTML = `

        <div class="place-name">
        ${name}
        </div>

        <div>
        📏 ${distance} KM Away
        </div>

        <button
        class="route-btn"
        onclick="startRoute(${lat},${lon},'${name.replace(/'/g,"")}')">

        🚗 Start Navigation

        </button>

        `;

        results.appendChild(card);

    });

}

/* ROUTING */

async function startRoute(lat,lng,name){

    try{

        if(!userLat || !userLng){

            alert("Enable location first");
            return;
        }

        destinationLat = lat;
        destinationLng = lng;
        destinationName = name;

        currentStepIndex = 0;

        if(routeLayer){

            map.removeLayer(routeLayer);
        }

        if(navigationInterval){

            clearInterval(navigationInterval);
        }

        const url =
        `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${lng},${lat}?overview=full&steps=true&geometries=geojson`;

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(
            !data.routes ||
            data.routes.length === 0
        ){

            alert("Route not found");
            return;
        }

        const route =
        data.routes[0];

        const coordinates =
        route.geometry.coordinates.map(
            coord => [coord[1],coord[0]]
        );

        routeLayer =
        L.polyline(
            coordinates,
            {
                color:"#00d9ff",
                weight:6
            }
        ).addTo(map);

        map.fitBounds(
            routeLayer.getBounds()
        );

        currentSteps =
        route.legs[0].steps;

        speakText(
            `Navigation started to ${name}`
        );

        speakNextDirection();

        navigationInterval =
        setInterval(()=>{

            speakNextDirection();

        },20000);

        updateLiveDistance();

    }catch(err){

        console.error(err);

        alert("Navigation failed");

    }

}

/* NEXT DIRECTION */

function speakNextDirection(){

    if(
        currentStepIndex >=
        currentSteps.length
    ){

        speakText(
            "Destination reached"
        );

        clearInterval(
            navigationInterval
        );

        return;
    }

    const step =
    currentSteps[currentStepIndex];

    if(step.maneuver.instruction){

        speakText(
            step.maneuver.instruction
        );
    }

    currentStepIndex++;

}

/* DISTANCE */

function updateLiveDistance(){

    if(!destinationLat) return;

    const distance =
    calculateDistance(
        userLat,
        userLng,
        destinationLat,
        destinationLng
    );

    document.getElementById("distanceLeft").innerText =
    `${distance} KM`;

    if(currentSpeed > 0){

        const hours =
        distance / currentSpeed;

        const mins =
        Math.round(hours * 60);

        document.getElementById("arrivalTime").innerText =
        `${mins} Minutes`;
    }

}

/* CALCULATE */

function calculateDistance(
lat1,lon1,lat2,lon2){

    const R = 6371;

    const dLat =
    (lat2-lat1) * Math.PI/180;

    const dLon =
    (lon2-lon1) * Math.PI/180;

    const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

    const c =
    2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return (R*c).toFixed(2);

}

/* SPEAK */

function speakText(text){

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 0.95;

    speechSynthesis.speak(speech);

}

/* CHAT */

async function sendAIMessage(){

    const input = document.getElementById("chatInput");
    const msg = input.value.trim();

    if(msg === "") return;

    addChat(msg, "user");
    input.value = "";

    // Create a structured, identifiable thinking bubble
    const chatBox = document.getElementById("chatMessages");
    const thinkingDiv = document.createElement("div");
    thinkingDiv.id = "thinkingBubble";
    thinkingDiv.classList.add("chat-bubble", "ai");
    thinkingDiv.innerText = "Thinking...";
    chatBox.appendChild(thinkingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch("/map_ai", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: msg,
                latitude: userLat,
                longitude: userLng,
                destination: destinationName,
                distance: document.getElementById("distanceLeft").innerText,
                duration: document.getElementById("arrivalTime").innerText,
                speed: currentSpeed,
                current_time: new Date().toLocaleTimeString()
            })
        });

        const data = await response.json();

        // Safe removal of the thinking element by its ID
        const targetBubble = document.getElementById("thinkingBubble");
        if(targetBubble) {
            targetBubble.remove();
        }

        addChat(data.reply, "ai");
        speakText(data.reply);

    } catch(err) {
        console.error(err);
        
        const targetBubble = document.getElementById("thinkingBubble");
        if(targetBubble) {
            targetBubble.remove();
        }

        addChat("AI connection failed", "ai");
    }
}

/* CHAT UI */

function addChat(text,type){

    const box =
    document.getElementById("chatMessages");

    const div =
    document.createElement("div");

    div.classList.add(
        "chat-bubble",
        type
    );

    div.innerText = text;

    box.appendChild(div);

    box.scrollTop =
    box.scrollHeight;

}

/* VOICE INPUT */

function startVoiceInput(){

    if(
        !window.webkitSpeechRecognition &&
        !window.SpeechRecognition
    ){

        alert(
            "Voice recognition not supported"
        );

        return;
    }

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    const recognition =
    new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult =
    function(event){

        const text =
        event.results[0][0].transcript;

        document.getElementById(
            "chatInput"
        ).value = text;

        sendAIMessage();

    };

}

/* REPEAT */

function repeatDirections(){

    if(currentSteps.length > 0){

        speakNextDirection();

    }else{

        speakText(
            "No active navigation"
        );

    }

}

</script>

<style>

/* ROTATE OVERLAY */

#rotateOverlay{

    position:fixed;

    inset:0;

    background:
    linear-gradient(
        135deg,
        #050816,
        #0d1228,
        #000000
    );

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:999999;

    color:white;

    text-align:center;

    overflow:hidden;
}

.rotate-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:25px;
}

/* PHONE ICON */

.phone{

    width:110px;

    height:190px;

    border:6px solid #00d9ff;

    border-radius:28px;

    position:relative;

    animation:rotatePhone 2s infinite ease-in-out;

    box-shadow:
    0 0 20px #00d9ff,
    0 0 40px #7b2cff;
}

.screen{

    position:absolute;

    top:12px;
    left:12px;
    right:12px;
    bottom:12px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #00d9ff,
        #7b2cff,
        #ff00ff
    );
}

@keyframes rotatePhone{

    0%{
        transform:rotate(0deg);
    }

    25%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(90deg);
    }

    75%{
        transform:rotate(90deg);
    }

    100%{
        transform:rotate(0deg);
    }

}

#rotateOverlay h1{

    font-size:34px;

    color:#00d9ff;

    font-family:'Orbitron',sans-serif;

    text-shadow:
    0 0 10px #00d9ff,
    0 0 25px #7b2cff;
}

#rotateOverlay p{

    font-size:17px;

    opacity:0.85;

    width:80%;

    max-width:350px;

    line-height:1.8;
}

</style>

<script>

/* ROTATION CHECK */

function checkOrientation(){

    const overlay =
    document.getElementById(
        "rotateOverlay"
    );

    /* PORTRAIT */

    if(
        window.innerHeight >
        window.innerWidth
    ){

        overlay.style.display =
        "flex";

        document.body.style.overflow =
        "hidden";

    }

    /* LANDSCAPE */

    else{

        overlay.style.display =
        "none";

        document.body.style.overflow =
        "hidden";

    }

}

/* INITIAL */

checkOrientation();

/* ON ROTATE */

window.addEventListener(
    "resize",
    checkOrientation
);

window.addEventListener(
    "orientationchange",
    checkOrientation
);

</script>
    
</body>
