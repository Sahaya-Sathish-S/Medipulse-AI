<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse AI · Smart Medical Navigation</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
  --bg:#060918;
  --panel:#0b1130;
  --panel-soft:rgba(14,19,48,0.72);
  --line:rgba(255,255,255,0.08);
  --cyan:#00e5ff;
  --violet:#7b2cff;
  --magenta:#ff2ee6;
  --green:#2bd576;
  --amber:#ffb020;
  --text:#f4f7ff;
  --muted:#93a1c9;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle,#00e5ff22 1px,transparent 1px),
    radial-gradient(circle,#ff2ee615 1px,transparent 1px);
  background-size:120px 120px, 90px 90px;
  background-position:0 0, 45px 45px;
  animation:bgMove 24s linear infinite;
  z-index:0;
  pointer-events:none;
}
@keyframes bgMove{ from{transform:translateY(0);} to{transform:translateY(-120px);} }

.main-container{
  position:relative;
  z-index:1;
  display:flex;
  height:100vh;
  width:100vw;
}

.sidebar{
  width:42%;
  min-width:380px;
  max-width:520px;
  position:relative;
  padding:24px 22px 22px;
  overflow-y:auto;
  border-right:1px solid var(--line);
  background:linear-gradient(rgba(4,6,18,0.86),rgba(4,6,18,0.93));
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.35);border-radius:10px;}

.brand{text-align:center;margin-bottom:18px;}
.logo{
  font-family:'Orbitron',sans-serif;
  font-size:30px;
  font-weight:700;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--magenta));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 14px rgba(0,229,255,0.35));
}
.tagline{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:2px;
}
.pulse-line{width:100%;height:34px;margin-top:10px;overflow:hidden;}
.pulse-line svg{width:200%;height:100%;animation:pulseScroll 3.2s linear infinite;}
.pulse-line path{
  fill:none;stroke:var(--cyan);stroke-width:2;
  filter:drop-shadow(0 0 6px var(--cyan));
}
@keyframes pulseScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

.status-pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 12px;
  border-radius:999px;background:rgba(43,213,118,0.12);border:1px solid rgba(43,213,118,0.4);
  color:var(--green);margin:0 auto 16px;width:fit-content;
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.6s infinite;}
.status-pill.off{background:rgba(255,176,32,0.12);border-color:rgba(255,176,32,0.4);color:var(--amber);}
.status-pill.off .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

.live-info{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  background:var(--panel-soft);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:16px;backdrop-filter:blur(20px);
}
.vital{background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
.vital-label{
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:6px;margin-bottom:4px;
}
.vital-value{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:600;color:var(--text);}
.vital.wide{grid-column:1 / -1;}

.btn-row{display:flex;gap:10px;margin-bottom:10px;}
.action-btn{
  flex:1;border:none;padding:15px 14px;border-radius:var(--radius-md);color:#fff;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:'Poppins',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
  background:linear-gradient(135deg,var(--cyan),var(--violet),var(--magenta));
  background-size:220% 220%;animation:gradientMove 6s ease infinite;
}
.action-btn.full{width:100%;flex:none;}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(123,44,255,0.35);}
.action-btn:active{transform:translateY(0);}
.action-btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.results{margin-top:18px;display:flex;flex-direction:column;gap:12px;}
.results-empty{
  text-align:center;color:var(--muted);font-size:13px;padding:18px 10px;
  border:1px dashed var(--line);border-radius:var(--radius-md);
}
.loader{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:14px;}
.spinner{
  width:16px;height:16px;border:2px solid rgba(0,229,255,0.25);
  border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.place-card{
  background:rgba(255,255,255,0.05);border-radius:var(--radius-lg);padding:16px;
  border:1px solid var(--line);transition:border-color 0.2s;
}
.place-card:hover{border-color:rgba(0,229,255,0.4);}
.place-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.place-name{color:var(--cyan);font-size:16px;font-weight:600;}
.place-type{
  font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;
  border-radius:999px;white-space:nowrap;
}
.place-type.hospital{background:rgba(255,46,230,0.15);color:var(--magenta);border:1px solid rgba(255,46,230,0.35);}
.place-type.pharmacy{background:rgba(43,213,118,0.15);color:var(--green);border:1px solid rgba(43,213,118,0.35);}
.place-meta{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;}
.route-btn{
  width:100%;border:none;padding:12px;border-radius:var(--radius-sm);cursor:pointer;margin-top:12px;
  color:#fff;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--cyan),#0066ff);
  transition:transform 0.2s;
}
.route-btn:hover{transform:translateY(-2px);}

.ai-chat{
  margin-top:20px;background:var(--panel-soft);border-radius:var(--radius-lg);padding:16px;
  border:1px solid var(--line);backdrop-filter:blur(20px);
}
.ai-chat h3{font-size:14px;color:var(--cyan);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.chat-messages{height:170px;overflow-y:auto;margin-bottom:12px;padding-right:4px;display:flex;flex-direction:column;gap:8px;}
.chat-messages::-webkit-scrollbar{width:5px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.3);border-radius:10px;}
.chat-bubble{padding:11px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;max-width:90%;}
.chat-bubble.user{background:linear-gradient(135deg,#0066ff,#0044cc);align-self:flex-end;border-bottom-right-radius:4px;}
.chat-bubble.ai{background:rgba(255,255,255,0.07);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-input{display:flex;gap:8px;}
.chat-input input{
  flex:1;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 14px;outline:none;background:rgba(255,255,255,0.06);color:var(--text);font-family:'Poppins',sans-serif;font-size:13.5px;
}
.chat-input input:focus{border-color:var(--cyan);}
.icon-btn{
  width:46px;flex-shrink:0;border:none;border-radius:var(--radius-sm);cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--magenta),var(--violet));transition:transform 0.2s;
}
.icon-btn:hover{transform:translateY(-2px);}
.icon-btn.listening{animation:micPulse 1s infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,46,230,0.5);}50%{box-shadow:0 0 0 8px rgba(255,46,230,0);}}

.map-container{flex:1;position:relative;min-width:0;}
#map{width:100%;height:100%;filter:saturate(1.05);}

.voice-route-btn{
  position:absolute;top:20px;right:20px;width:58px;height:58px;border:none;border-radius:50%;
  cursor:pointer;color:#fff;font-size:20px;z-index:900;
  background:linear-gradient(135deg,var(--magenta),var(--violet));
  box-shadow:0 6px 20px rgba(123,44,255,0.45);transition:transform 0.2s;
}
.voice-route-btn:hover{transform:scale(1.08);}

.time-box{
  position:absolute;bottom:20px;right:20px;z-index:900;
  background:rgba(6,9,24,0.75);padding:12px 16px;border-radius:var(--radius-md);
  backdrop-filter:blur(16px);border:1px solid var(--line);line-height:1.7;font-size:12.5px;
}
.time-box .row{display:flex;align-items:center;gap:8px;}

.toast-stack{position:absolute;top:20px;left:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{
  background:rgba(6,9,24,0.92);border:1px solid var(--line);border-left:3px solid var(--amber);
  padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;animation:toastIn 0.25s ease;
}
.toast.error{border-left-color:#ff4d6d;}
.toast.success{border-left-color:var(--green);}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.leaflet-popup-content-wrapper{background:#0b1130;color:var(--text);border-radius:12px;}
.leaflet-popup-tip{background:#0b1130;}

@media (max-width:900px){
  .main-container{flex-direction:column;height:100vh;}
  .sidebar{width:100%;max-width:none;min-width:0;height:56vh;border-right:none;border-bottom:1px solid var(--line);}
  .map-container{height:44vh;}
  .voice-route-btn{width:50px;height:50px;font-size:17px;top:12px;right:12px;}
  .time-box{bottom:12px;right:12px;padding:10px 12px;}
}
@media (max-width:480px){
  .btn-row{flex-direction:column;}
  .logo{font-size:24px;}
}
</style>
</head>

<body>

<div class="main-container">

  <div class="sidebar">

    <div class="brand">
      <div class="logo">MediPulse AI</div>
      <div class="tagline">Smart Medical Navigation</div>
      <div class="pulse-line">
        <svg viewBox="0 0 400 40" preserveAspectRatio="none">
          <path d="M0,20 L60,20 L75,20 L85,4 L95,36 L105,20 L400,20 M400,20 L460,20 L475,20 L485,4 L495,36 L505,20 L800,20"/>
        </svg>
      </div>
    </div>

    <div class="status-pill off" id="gpsStatusPill">
      <span class="dot"></span>
      <span id="gpsStatusText">GPS Offline</span>
    </div>

    <div class="live-info">
      <div class="vital wide">
        <div class="vital-label"><i class="fa-solid fa-location-dot"></i> Current Location</div>
        <div class="vital-value" id="locationText" style="font-size:13px;">Waiting for GPS…</div>
      </div>
      <div class="vital">
        <div class="vital-label"><i class="fa-solid fa-gauge-high"></i> Speed</div>
        <div class="vital-value" id="speedText">0 km/h</div>
      </div>
      <div class="vital">
        <div class="vital-label"><i class="fa-solid fa-clock"></i> Time</div>
        <div class="vital-value" id="currentTime">--:--:--</div>
      </div>
      <div class="vital">
        <div class="vital-label"><i class="fa-solid fa-route"></i> Distance</div>
        <div class="vital-value" id="distanceLeft">--</div>
      </div>
      <div class="vital">
        <div class="vital-label"><i class="fa-solid fa-hourglass-half"></i> ETA</div>
        <div class="vital-value" id="arrivalTime">--</div>
      </div>
    </div>

    <button class="action-btn full" onclick="enableLocation()">
      <i class="fa-solid fa-location-crosshairs"></i> Turn On Location
    </button>

    <div class="btn-row" style="margin-top:10px;">
      <button class="action-btn" onclick="searchNearby('hospital')">
        <i class="fa-solid fa-hospital"></i> Hospitals
      </button>
      <button class="action-btn" onclick="searchNearby('pharmacy')">
        <i class="fa-solid fa-prescription-bottle-medical"></i> Pharmacies
      </button>
    </div>

    <div class="results" id="results">
      <div class="results-empty">Turn on location, then search to see nearby hospitals or pharmacies here.</div>
    </div>

    <div class="ai-chat">
      <h3><i class="fa-solid fa-robot"></i> AI Medical Assistant</h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask about your route or a symptom…" onkeydown="if(event.key==='Enter')sendAIMessage()">
        <button class="icon-btn" onclick="sendAIMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        <button class="icon-btn" id="micBtn" onclick="startVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
      </div>
    </div>

  </div>

  <div class="map-container">
    <div id="map"></div>

    <div class="toast-stack" id="toastStack"></div>

    <button class="voice-route-btn" onclick="repeatDirections()" title="Repeat directions">
      <i class="fa-solid fa-volume-high"></i>
    </button>

    <div class="time-box">
      <div class="row"><i class="fa-solid fa-clock"></i> <span id="liveClock">--:--:--</span></div>
      <div class="row"><i class="fa-solid fa-satellite-dish"></i> <span id="gpsLiveLabel">GPS Standby</span></div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   STATE & CONSTANTS
============================================================ */
let map, userMarker, routeLayer;
let userLat = null, userLng = null, currentSpeed = 0;
let destinationLat = null, destinationLng = null, destinationName = "";
let currentSteps = [], currentStepIndex = 0, navigationInterval = null;
let markers = [];

const OVERPASS_ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.openstreetmap.ru/api/interpreter"
];

delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
  iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
  shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png"
});

const hospitalIcon = L.divIcon({
  className: "",
  html: '<div style="background:#ff2ee6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #ff2ee6;"></div>',
  iconSize: [16,16], iconAnchor: [8,8]
});
const pharmacyIcon = L.divIcon({
  className: "",
  html: '<div style="background:#2bd576;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #2bd576;"></div>',
  iconSize: [16,16], iconAnchor: [8,8]
});

map = L.map("map", { zoomControl: true }).setView([20.5937, 78.9629], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors",
  maxZoom: 19
}).addTo(map);

/* ============================================================
   TOASTS & CLOCK
============================================================ */
function showToast(message, type = "info", duration = 4000) {
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerText = message;
  stack.appendChild(el);
  setTimeout(() => el.remove(), duration);
}

setInterval(() => {
  const now = new Date().toLocaleTimeString();
  document.getElementById("liveClock").innerText = now;
  document.getElementById("currentTime").innerText = now;
}, 1000);

/* ============================================================
   LOCATION
============================================================ */
function enableLocation() {
  if (!navigator.geolocation) {
    showToast("Geolocation is not supported on this device.", "error");
    return;
  }

  navigator.geolocation.watchPosition(
    (position) => {
      userLat = position.coords.latitude;
      userLng = position.coords.longitude;
      currentSpeed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0;

      document.getElementById("locationText").innerText = `${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;
      document.getElementById("speedText").innerText = `${currentSpeed} km/h`;

      const pill = document.getElementById("gpsStatusPill");
      pill.classList.remove("off");
      document.getElementById("gpsStatusText").innerText = "GPS Active";
      document.getElementById("gpsLiveLabel").innerText = "GPS Active";

      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("You are here");

      if (!window.__gpsCentered) {
        map.setView([userLat, userLng], 15);
        window.__gpsCentered = true;
      }

      updateLiveDistance();
    },
    (error) => {
      console.error(error);
      showToast("Location permission was denied or is unavailable. Please allow GPS access.", "error");
    },
    { enableHighAccuracy: true }
  );

  speakText("GPS enabled");
}

/* ============================================================
   NEARBY SEARCH
============================================================ */
function buildOverpassQuery(type, lat, lng, radius) {
  const filters =
    type === "pharmacy"
      ? `node(around:${radius},${lat},${lng})["amenity"="pharmacy"];
         node(around:${radius},${lat},${lng})["shop"="chemist"];
         node(around:${radius},${lat},${lng})["healthcare"="pharmacy"];`
      : `node(around:${radius},${lat},${lng})["amenity"="hospital"];
         node(around:${radius},${lat},${lng})["healthcare"="hospital"];
         node(around:${radius},${lat},${lng})["amenity"="clinic"];`;

  return `[out:json][timeout:25];(${filters});out center;`;
}

async function fetchOverpassDirect(type, lat, lng) {
  const radiiToTry = [10000, 25000];
  let lastError = null;

  for (const radius of radiiToTry) {
    const query = buildOverpassQuery(type, lat, lng, radius);
    for (const endpoint of OVERPASS_ENDPOINTS) {
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `data=${encodeURIComponent(query)}`
        });
        if (!response.ok) continue;
        const data = await response.json();
        if (data && Array.isArray(data.elements) && data.elements.length > 0) {
          return data.elements;
        }
      } catch (err) {
        lastError = err;
      }
    }
  }
  if (lastError) throw lastError;
  return [];
}

async function searchNearby(type) {
  if (!userLat || !userLng) {
    showToast("Turn on location first so I know where to search from.", "error");
    return;
  }

  const results = document.getElementById("results");
  results.innerHTML = `<div class="loader"><div class="spinner"></div> Searching nearby ${type === "hospital" ? "hospitals" : "pharmacies"}…</div>`;

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  let elements = [];
  try {
    // Try backend proxy endpoint first
    const response = await fetch("/api/nearby", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, lat: userLat, lng: userLng })
    });
    if (response.ok) {
      const data = await response.json();
      elements = data.elements || [];
    } else {
      throw new Error(`Proxy status: ${response.status}`);
    }
  } catch (backendErr) {
    console.warn("Backend proxy unavailable, failing over to direct fetch:", backendErr.message);
    try {
      elements = await fetchOverpassDirect(type, userLat, userLng);
    } catch (directErr) {
      console.error("Direct fetch failed completely:", directErr);
      results.innerHTML = `<div class="results-empty">Couldn't reach map data service right now.<br><span style="color:var(--muted);font-size:11px;">${escapeHtml(directErr.message)}</span></div>`;
      showToast("Nearby search failed — check network connection.", "error");
      return;
    }
  }

  if (elements.length === 0) {
    results.innerHTML = `<div class="results-empty">No ${type === "hospital" ? "hospitals" : "pharmacies"} found within 25 km. Try again from another location.</div>`;
    return;
  }

  displayPlaces(elements, type);
}

/* ============================================================
   DISPLAY RESULTS
============================================================ */
function displayPlaces(places, type) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  const valid = places.filter(p => p.lat && p.lon);
  if (valid.length === 0) {
    results.innerHTML = `<div class="results-empty">No results with usable coordinates were returned.</div>`;
    return;
  }

  valid
    .map(place => ({
      ...place,
      _distance: parseFloat(calculateDistance(userLat, userLng, place.lat, place.lon))
    }))
    .sort((a, b) => a._distance - b._distance)
    .forEach(place => {
      const lat = place.lat, lon = place.lon;
      const name = place.tags?.name || (type === "pharmacy" ? "Pharmacy" : "Medical Center");
      const icon = type === "pharmacy" ? pharmacyIcon : hospitalIcon;

      const marker = L.marker([lat, lon], { icon }).addTo(map).bindPopup(name);
      markers.push(marker);

      const card = document.createElement("div");
      card.className = "place-card";
      card.innerHTML = `
        <div class="place-head">
          <div class="place-name">${escapeHtml(name)}</div>
          <div class="place-type ${type}">${type}</div>
        </div>
        <div class="place-meta">
          <span><i class="fa-solid fa-route"></i> ${place._distance} km away</span>
        </div>
        <button class="route-btn" data-lat="${lat}" data-lon="${lon}" data-name="${escapeHtml(name)}">
          <i class="fa-solid fa-diamond-turn-right"></i> Start Navigation
        </button>
      `;
      card.querySelector(".route-btn").addEventListener("click", (e) => {
        const btn = e.currentTarget;
        startRoute(parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lon), btn.dataset.name);
      });
      results.appendChild(card);
    });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str;
  return div.innerHTML;
}

/* ============================================================
   ROUTING
============================================================ */
async function fetchRouteDirect(fromLat, fromLng, toLat, toLng) {
  const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&steps=true&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`OSRM HTTP ${res.status}`);
  return await res.json();
}

async function startRoute(lat, lng, name) {
  if (!userLat || !userLng) {
    showToast("Turn on location first.", "error");
    return;
  }

  destinationLat = lat;
  destinationLng = lng;
  destinationName = name;
  currentStepIndex = 0;

  if (routeLayer) map.removeLayer(routeLayer);
  if (navigationInterval) clearInterval(navigationInterval);

  let data;
  try {
    const response = await fetch("/api/route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fromLat: userLat, fromLng: userLng, toLat: lat, toLng: lng })
    });

    if (response.ok) {
      data = await response.json();
    } else {
      throw new Error(`Proxy status ${response.status}`);
    }
  } catch (proxyErr) {
    console.warn("Backend route proxy unavailable, falling back directly:", proxyErr.message);
    try {
      data = await fetchRouteDirect(userLat, userLng, lat, lng);
    } catch (directErr) {
      console.error(directErr);
      showToast("Couldn't calculate a route — service unavailable.", "error");
      return;
    }
  }

  if (!data || !data.routes || data.routes.length === 0) {
    showToast("No drivable route could be found.", "error");
    return;
  }

  const route = data.routes[0];
  const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);

  routeLayer = L.polyline(coordinates, { color: "#00e5ff", weight: 6, opacity: 0.9 }).addTo(map);
  map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

  currentSteps = route.legs[0].steps;

  showToast(`Navigation started to ${name}`, "success");
  speakText(`Navigation started to ${name}`);
  speakNextDirection();

  navigationInterval = setInterval(speakNextDirection, 20000);
  updateLiveDistance();
}

function speakNextDirection() {
  if (currentStepIndex >= currentSteps.length) {
    speakText("Destination reached");
    clearInterval(navigationInterval);
    return;
  }
  const step = currentSteps[currentStepIndex];
  if (step.maneuver && step.maneuver.instruction) speakText(step.maneuver.instruction);
  currentStepIndex++;
}

function updateLiveDistance() {
  if (!destinationLat || !userLat) return;
  const distance = calculateDistance(userLat, userLng, destinationLat, destinationLng);
  document.getElementById("distanceLeft").innerText = `${distance} km`;
  if (currentSpeed > 0) {
    const mins = Math.round((distance / currentSpeed) * 60);
    document.getElementById("arrivalTime").innerText = `${mins} min`;
  }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return (R * c).toFixed(2);
}

/* ============================================================
   VOICE OUTPUT & INPUT
============================================================ */
function speakText(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 0.95;
  speechSynthesis.speak(speech);
}

function startVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast("Voice recognition isn't supported in this browser.", "error");
    return;
  }

  const micBtn = document.getElementById("micBtn");
  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";

  recognition.onstart = () => micBtn.classList.add("listening");
  recognition.onend = () => micBtn.classList.remove("listening");
  recognition.onerror = () => micBtn.classList.remove("listening");

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("chatInput").value = text;
    sendAIMessage();
  };

  recognition.start();
}

function repeatDirections() {
  if (currentSteps.length > 0) {
    speakNextDirection();
  } else {
    speakText("No active navigation");
    showToast("No active navigation to repeat.", "info");
  }
}

/* ============================================================
   AI CHAT & FALLBACK
============================================================ */
function fallbackReply(message, context) {
  const lower = message.toLowerCase();
  const emergencyWords = [
    "chest pain", "can't breathe", "cannot breathe", "unconscious",
    "severe bleeding", "stroke", "heart attack", "suicidal", "overdose"
  ];
  if (emergencyWords.some((w) => lower.includes(w))) {
    return "If this is an emergency, call your local emergency number right now — don't wait for directions from this app. Once you're safe, I can help you find the nearest hospital.";
  }

  if (lower.includes("eta") || lower.includes("how long") || lower.includes("time left")) {
    return context.duration && context.duration !== "--"
      ? `You're about ${context.duration} away from ${context.destination || "your destination"}, roughly ${context.distance || "an unknown distance"}.`
      : "Start navigation to a location first and I can tell you your ETA.";
  }

  if (lower.includes("distance") || lower.includes("far")) {
    return context.distance && context.distance !== "--"
      ? `You have about ${context.distance} left to ${context.destination || "your destination"}.`
      : "Start navigation to a location and I'll track the remaining distance for you.";
  }

  return "I can help with directions, ETA, or general non-emergency health questions, but for anything specific to your symptoms please check with a licensed medical professional.";
}

async function sendAIMessage() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (msg === "") return;

  addChat(msg, "user");
  input.value = "";

  const chatBox = document.getElementById("chatMessages");
  const thinkingDiv = document.createElement("div");
  thinkingDiv.id = "thinkingBubble";
  thinkingDiv.className = "chat-bubble ai";
  thinkingDiv.innerHTML = `<div class="loader" style="padding:0;"><div class="spinner"></div> Thinking…</div>`;
  chatBox.appendChild(thinkingDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  const context = {
    latitude: userLat,
    longitude: userLng,
    destination: destinationName,
    distance: document.getElementById("distanceLeft").innerText,
    duration: document.getElementById("arrivalTime").innerText,
    speed: currentSpeed,
    current_time: new Date().toLocaleTimeString()
  };

  let replyText = "";
  try {
    const response = await fetch("/map_ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, ...context })
    });
    if (response.ok) {
      const data = await response.json();
      replyText = data.reply;
    } else {
      replyText = fallbackReply(msg, context);
    }
  } catch (err) {
    replyText = fallbackReply(msg, context);
  }

  document.getElementById("thinkingBubble")?.remove();
  addChat(replyText, "ai");
  speakText(replyText);
}

function addChat(text, type) {
  const box = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = `chat-bubble ${type}`;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>
