<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: url("{{ url_for('static', filename='images/background.png') }}") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 36px;
            letter-spacing: 1px;
        }

        .features {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .card i {
            font-size: 40px;
            margin-bottom: 15px;
            color: #00e6e6;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, #00d9ff, #7b2cff, #ff00ff);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px #00d9ff;
        }
    </style>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="overlay"></div>

    <div class="container">

        <h1>🩸 Blood Donation System</h1>

        <div class="features">

            <!-- REGISTER -->
            <div class="card">
                <i class="fa-solid fa-user-plus"></i>
                <h2>Register Donor</h2>
                <p>
                    Add new blood donors into the system with full details like blood group, phone and address.
                </p>

                <a href="/register" class="btn">
                    Register Donor
                </a>
            </div>

            <!-- EMERGENCY -->
            <div class="card">
                <i class="fa-solid fa-truck-medical"></i>
                <h2>Emergency Search</h2>
                <p>
                    Find available blood donors instantly during emergency situations.
                </p>

                <a href="/emergency" class="btn">
                    Emergency Search
                </a>
            </div>

        </div>

    </div>

</body>

</html>
