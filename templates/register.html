<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPulse AI - Donor Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.82)), url("{{ url_for('static', filename='images/background.png') }}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 50px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0,217,255,0.15);
}

.logo-group { display: flex; align-items: center; gap: 12px; }

.logo-group i {
    color: #00D9FF;
    font-size: 28px;
    animation: pulseGlow 2s infinite alternate;
}

.logo {
    font-size: 28px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00D9FF;
    text-shadow: 0 0 15px rgba(0,217,255,0.4);
}

.profile-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #ff00ff;
    box-shadow: 0 0 15px rgba(255,0,255,0.3);
    transition: 0.3s ease;
}
.profile-icon:hover { transform: scale(1.08) rotate(5deg); }
.profile-icon img { width: 100%; height: 100%; object-fit: cover; }

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px 60px;
}

.dashboard-header {
    text-align: center;
    margin-bottom: 40px;
}
.dashboard-header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 10px;
}
.dashboard-header h1 span {
    color: #00D9FF;
    text-shadow: 0 0 20px rgba(0,217,255,0.5);
}
.dashboard-header p { color: #b0c4de; font-size: 16px; }

/* GLASS PANEL */
.glass-panel {
    background: rgba(10,25,50,0.45);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(0,217,255,0.15);
    border-radius: 24px;
    padding: 45px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
}

.glass-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, #00D9FF, #ff00ff, #00D9FF);
    background-size: 200% auto;
    animation: moveGradient 4s linear infinite;
}

/* SECTION LABEL */
.section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #00D9FF;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,217,255,0.4), transparent);
}

/* FORM GRID */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 30px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group.full-width { grid-column: span 2; }

.form-group label {
    font-size: 11px;
    font-weight: 600;
    color: #a0aec0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.form-group input,
.form-group select,
.form-group textarea {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,217,255,0.2);
    border-radius: 12px;
    padding: 13px 16px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    width: 100%;
}

.form-group select option { background: #0a1932; color: #fff; }

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #00D9FF;
    box-shadow: 0 0 15px rgba(0,217,255,0.2);
    background: rgba(0,217,255,0.07);
}

.form-group input::placeholder,
.form-group textarea::placeholder { color: rgba(255,255,255,0.3); }

.form-group textarea {
    height: 90px;
    resize: none;
}

/* TOGGLE PAIR */
.toggle-pair {
    display: flex;
    gap: 10px;
}
.toggle-opt {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #a0aec0;
    font-size: 13px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s;
}
.toggle-opt:hover { border-color: rgba(0,217,255,0.4); color: #fff; }
.toggle-opt.active {
    border-color: #00D9FF;
    background: rgba(0,217,255,0.12);
    color: #00D9FF;
    box-shadow: 0 0 12px rgba(0,217,255,0.2);
}

/* DIVIDER */
.section-divider { margin: 30px 0; }

/* SUBMIT BUTTON */
.submit-zone { text-align: center; margin-top: 10px; }

.register-btn {
    background: linear-gradient(45deg, #00D9FF, #0077ff, #ff00ff);
    background-size: 200% auto;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 18px 55px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0,217,255,0.3);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: moveGradient 3s linear infinite;
}
.register-btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 40px rgba(255,0,255,0.6);
}
.register-btn:disabled {
    background: #4a5568 !important;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
    animation: none;
}

/* LOADER */
.hologram-loader {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 30px 0;
    gap: 20px;
}
.cyber-spinner {
    width: 60px; height: 60px;
    border: 3px solid transparent;
    border-top-color: #00D9FF;
    border-bottom-color: #ff00ff;
    border-radius: 50%;
    animation: spinCyber 1.5s linear infinite;
    position: relative;
}
.cyber-spinner::after {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 3px solid transparent;
    border-left-color: #00ffaa;
    border-radius: 50%;
    animation: spinCyber 3s linear infinite reverse;
}
.loader-status-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: #00D9FF;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: pulseGlow 1.5s infinite alternate;
}

/* SUCCESS BANNER */
.success-banner {
    display: none;
    background: rgba(0,255,170,0.1);
    border: 1px solid rgba(0,255,170,0.4);
    border-radius: 14px;
    padding: 20px 25px;
    text-align: center;
    margin-top: 20px;
    animation: slideUpFade 0.5s ease forwards;
}
.success-banner i { color: #00ffaa; font-size: 28px; margin-bottom: 10px; display: block; }
.success-banner p { color: #00ffaa; font-size: 15px; font-weight: 500; }

/* ANIMATIONS */
@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
@keyframes spinCyber {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes pulseGlow {
    0% { opacity: 0.4; text-shadow: 0 0 5px rgba(0,217,255,0.2); }
    100% { opacity: 1; text-shadow: 0 0 15px rgba(0,217,255,0.7); }
}
@keyframes slideUpFade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* MOBILE */
@media (max-width: 768px) {
    .top-bar { padding: 18px 20px; }
    .dashboard-header h1 { font-size: 26px; }
    .glass-panel { padding: 25px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full-width { grid-column: span 1; }
    .register-btn { width: 100%; padding: 16px; }
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo-group">
        <i class="fa-solid fa-microchip"></i>
        <div class="logo">MediPulse</div>
    </div>
    <div class="profile-icon">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
    </div>
</div>

<div class="container">

    <div class="dashboard-header">
        <h1>Donor <span>Registration</span> Portal</h1>
        <p>Submit your profile to the MediPulse blood donor network and save lives.</p>
    </div>

    <div class="glass-panel">

        <!-- PERSONAL INFORMATION -->
        <div class="section-label">
            <i class="fa-solid fa-user-doctor"></i> Personal Information
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input id="full_name" placeholder="e.g. Alex Johnson" required>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input id="age" type="number" placeholder="Must be 18+" required>
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input id="dob" type="date" required>
            </div>
            <div class="form-group">
                <label>Guardian Name</label>
                <input id="guardian_name" placeholder="Optional">
            </div>
            <div class="form-group">
                <label>Marital Status</label>
                <select id="marital_status">
                    <option>Single</option>
                    <option>Married</option>
                </select>
            </div>
            <div class="form-group">
                <label>Occupation</label>
                <select id="occupation_status">
                    <option>Studying</option>
                    <option>Working</option>
                </select>
            </div>
        </div>

        <!-- MEDICAL METRICS -->
        <div class="section-divider">
            <div class="section-label">
                <i class="fa-solid fa-droplet"></i> Medical Metrics
            </div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Blood Group</label>
                <select id="blood_group" required>
                    <option value="" disabled selected>Select Blood Group</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option>
                    <option>AB+</option><option>AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Weight (kg)</label>
                <input id="weight" type="number" step="0.1" placeholder="e.g. 68.5">
            </div>
            <div class="form-group">
                <label>Height (cm)</label>
                <input id="height" type="number" step="0.1" placeholder="e.g. 172.0">
            </div>
            <div class="form-group">
                <label>Past Accident / Illness</label>
                <input id="past_accident" placeholder="Brief description or leave blank">
            </div>

            <!-- Alcohol Toggle -->
            <div class="form-group">
                <label>Alcohol Usage</label>
                <div class="toggle-pair">
                    <button type="button" class="toggle-opt active" id="alc-no" onclick="setToggle('alcohol','No')">🚫 No</button>
                    <button type="button" class="toggle-opt" id="alc-yes" onclick="setToggle('alcohol','Yes')">✅ Yes</button>
                </div>
                <input type="hidden" id="alcohol_usage" value="No">
            </div>

            <!-- Smoking Toggle -->
            <div class="form-group">
                <label>Smoking</label>
                <div class="toggle-pair">
                    <button type="button" class="toggle-opt active" id="smk-no" onclick="setToggle('smoking','No')">🚫 No</button>
                    <button type="button" class="toggle-opt" id="smk-yes" onclick="setToggle('smoking','Yes')">✅ Yes</button>
                </div>
                <input type="hidden" id="smoking" value="No">
            </div>
        </div>

        <!-- CONTACT -->
        <div class="section-divider">
            <div class="section-label">
                <i class="fa-solid fa-satellite-dish"></i> Contact Details
            </div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Email Address</label>
                <input id="email" type="email" placeholder="donor@email.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input id="phone" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group full-width">
                <label>Residential Address</label>
                <textarea id="address" placeholder="Street, City, State, PIN Code" required></textarea>
            </div>
        </div>

        <!-- LOADER -->
        <div class="hologram-loader" id="regLoader">
            <div class="cyber-spinner"></div>
            <div class="loader-status-text">Uploading donor profile to secure vault...</div>
        </div>

        <!-- SUBMIT -->
        <div class="submit-zone">
            <button class="register-btn" id="submitBtn" onclick="registerDonor()">
                <i class="fa-solid fa-heart-pulse" style="margin-right:10px;"></i> REGISTER AS DONOR
            </button>
        </div>

        <!-- SUCCESS -->
        <div class="success-banner" id="successBanner">
            <i class="fa-solid fa-circle-check"></i>
            <p>Donor profile registered successfully! You're now part of the MediPulse network.</p>
        </div>

    </div>
</div>

<script>
const supabaseUrl = "https://covmgrilycetqtpwolfl.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvdm1ncmlseWNldHF0cHdvbGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjE4OTcsImV4cCI6MjA5NDczNzg5N30.nu-_HD1m-7FlOfwWo0zzBvCdRBPb_vQWyvYwhkNHnQc";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function setToggle(type, value) {
    if (type === 'alcohol') {
        document.getElementById('alcohol_usage').value = value;
        document.getElementById('alc-no').classList.toggle('active', value === 'No');
        document.getElementById('alc-yes').classList.toggle('active', value === 'Yes');
    } else {
        document.getElementById('smoking').value = value;
        document.getElementById('smk-no').classList.toggle('active', value === 'No');
        document.getElementById('smk-yes').classList.toggle('active', value === 'Yes');
    }
}

async function registerDonor() {
    const age = parseInt(document.getElementById("age").value);

    if (!document.getElementById("full_name").value ||
        !age || !document.getElementById("dob").value ||
        !document.getElementById("blood_group").value ||
        !document.getElementById("phone").value ||
        !document.getElementById("address").value) {
        alert("⚠️ Please fill in all required fields.");
        return;
    }

    if (age < 18) {
        alert("❌ Registration denied. Donor must be 18+ years old.");
        return;
    }

    const btn = document.getElementById("submitBtn");
    const loader = document.getElementById("regLoader");
    btn.disabled = true;
    loader.style.display = "flex";
    document.getElementById("successBanner").style.display = "none";

    const donor = {
        full_name: document.getElementById("full_name").value,
        age,
        dob: document.getElementById("dob").value,
        weight: document.getElementById("weight").value ? parseFloat(document.getElementById("weight").value) : null,
        height: document.getElementById("height").value ? parseFloat(document.getElementById("height").value) : null,
        blood_group: document.getElementById("blood_group").value,
        address: document.getElementById("address").value,
        guardian_name: document.getElementById("guardian_name").value,
        marital_status: document.getElementById("marital_status").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        alcohol_usage: document.getElementById("alcohol_usage").value,
        smoking: document.getElementById("smoking").value,
        past_accident: document.getElementById("past_accident").value,
        occupation_status: document.getElementById("occupation_status").value,
        available: true
    };

    const { error } = await supabaseClient.from("donors").insert([donor]);

    loader.style.display = "none";

    if (error) {
        alert("❌ Error saving donor: " + error.message);
        btn.disabled = false;
    } else {
        document.getElementById("successBanner").style.display = "block";
        document.querySelectorAll("input, select, textarea").forEach(el => {
            if (el.type !== "hidden") el.value = "";
        });
        setToggle('alcohol', 'No');
        setToggle('smoking', 'No');
        setTimeout(() => { btn.disabled = false; }, 3000);
    }
}
</script>
</body>
</html>
